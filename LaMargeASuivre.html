<style>
/* Layout: en-tête fixe (client + onglets), puis une colonne de travail de 1100px max, tableaux défilants dans leur conteneur */
:root{--bg:#f2f5f3;--panel:#fff;--fg:#16201c;--mut:#5b6b64;--line:#dbe3df;--acc:#0f6b54;--acc2:#e7f2ee;--good:#1d7a4d;--warn:#a8650b;--bad:#b83227;--goodbg:#e3f3ea;--warnbg:#fbefd9;--badbg:#fbe4e1;--ink:#0b3d32;--onacc:#fff;

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:14px/1.5 var(--fb);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
.wrap{max-width:1100px;margin:0 auto}
h1,h2,h3{font-family:var(--fd);margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:20px}h3{font-size:15px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-top:12px;border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}

main{padding-top:18px;display:grid;gap:16px}main>*{min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px;min-width:0}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}

.kpi{padding:14px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}

.mut{color:var(--mut)}.small{font-size:12px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}

th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);font-weight:600}
td.n,th.n{text-align:right}
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;max-width:100%}

textarea{width:100%;font-family:ui-monospace,monospace;font-size:12px}
:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
button{background:var(--acc);color:var(--onacc);border:0;border-radius:6px;padding:7px 13px;cursor:pointer;font-weight:600}
button.g{background:transparent;color:var(--acc);border:1px solid var(--line)}
button.x{background:transparent;color:var(--bad);border:0;padding:4px 8px}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600}
.ok{background:var(--goodbg);color:var(--good)}.wn{background:var(--warnbg);color:var(--warn)}.bd{background:var(--badbg);color:var(--bad)}.nt{background:var(--acc2);color:var(--ink)}
.good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}
.banner{border:1px solid var(--acc);background:var(--acc2);color:var(--ink);border-radius:8px;padding:10px 14px}
.note{border-left:3px solid var(--warn);background:var(--warnbg);padding:8px 12px;border-radius:0 6px 6px 0;font-size:13px}
.list{display:grid;gap:8px}
.item{display:flex;gap:10px;align-items:flex-start}
.item .pill{flex:none;margin-top:1px}
svg text{fill:var(--mut);font:11px var(--fb)}
.mode{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.mode button{background:transparent;color:var(--mut);border-radius:0}.mode button.on{background:var(--acc2);color:var(--ink)}
.pz{display:grid;gap:4px;max-height:520px;overflow:auto}
.pz button{background:transparent;color:var(--fg);text-align:left;border:1px solid transparent;display:flex;justify-content:space-between;gap:8px;font-weight:500}
.pz button.on{background:var(--acc2);border-color:var(--acc)}
.ex{font-size:12px;color:var(--warn)}
.drop{position:relative;display:grid;gap:4px;justify-items:center;padding:22px 16px;border:2px dashed var(--line);border-radius:8px;cursor:pointer;text-align:center}
.drop.over,.drop:hover{border-color:var(--acc);background:var(--acc2)}
.draft{border-top:1px solid var(--line);padding-top:12px;margin-top:12px;display:grid;gap:8px}
.draft select,.draft input{max-width:230px}
.mode{max-width:100%;overflow-x:auto;scrollbar-width:thin}.mode button{white-space:nowrap;flex:none}
.split{display:grid;gap:16px;grid-template-columns:minmax(240px,1fr) minmax(300px,2.4fr)}
#newcl .sm{display:none}
/* Téléphone : en-tête compact sur une ligne, indicateurs sur deux colonnes, fiche sous la liste des produits */
@media (max-width:640px){
 .brand small,.top label{display:none}
 .brand{font-size:15px;line-height:1.15}
 .top{flex-wrap:nowrap}.top .row{flex-wrap:nowrap;flex:1;min-width:0;justify-content:flex-end;gap:8px}
 #cl{min-width:0;flex:1;max-width:200px}#newcl{padding:7px 10px;flex:none}#newcl .lg{display:none}#newcl .sm{display:inline}

 .split{grid-template-columns:1fr}.pz{max-height:240px}

function migrate(st){if(!st||!st.clients)return st;Object.values(st.clients).forEach(c=>{if(!c)return;c.recs=c.recs||[];c.preps=c.preps||[];c.couv=c.couv||{};

/* Sauvegarde dans un fichier JSON daté : capacité « downloads » dans Claude, lien de téléchargement ailleurs */
async function saveBackupFile(btn){
  const now=new Date(),name='lamargeasuivre-sauvegarde-'+now.toISOString().slice(0,10)+'.json';
  const done=()=>{S.lastBackup=Date.now();save();const i=$('#bkinfo');if(i)i.textContent='Dernier fichier de sauvegarde : '+new Date(S.lastBackup).toLocaleString('fr-FR')+'.'};
  const blob=new Blob([JSON.stringify({app:'LaMargeASuivre',format:2,enregistre:now.toISOString(),data:{...S,lastBackup:Date.now()}},null,1)],{type:'application/json'});
  const say=m=>{btn.textContent=m;setTimeout(()=>{btn.textContent='Enregistrer la sauvegarde dans un fichier'},4000)};
  if(inClaude()){const dl=await cap('downloads');
    if(!dl){say('Enregistrement indisponible ici : utilise le copier-coller');return}
    try{await dl.save({filename:name,data:blob});done();say('Fichier enregistré')}catch(e){say(e&&e.code==='declined'?'Enregistrement annulé':'Fichier non enregistré')}
    return}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);done();say('Fichier téléchargé : '+name)}

/* ---------- calculs ---------- */
function cadre(d){const a=d.cad;return {tot:(+a.perso||0)+(+a.loyer||0)+(+a.energie||0)+(+a.autres||0)+(+a.emprunt||0)+(+a.verse||0)}}
/* Frais proportionnels au CA : commissions des plateformes sur la part de CA qu'elles apportent, et frais de paiement */
function varPct(d){const v=d.var||{};return (+v.plat||0)*(+v.com||0)/100+(+v.cb||0)}
function monthsOf(d){return [...new Set(d.docs.map(x=>x.date.slice(0,7)))].sort()}
/* Prix TTC d'une ligne de ventes : celui figé au moment de la vente (pu), sinon le prix actuel de la carte */
function puOf(d,l){if(l.pu>0)return +l.pu;const r=d.recs.find(r=>r.nom===l.p);return r?+r.ttc||0:0}
/* Avant tout changement de prix, fige l'ancien prix sur les ventes déjà enregistrées pour ne pas réécrire le passé */
function figePrix(d,nom,prix){if(!(prix>0))return;d.docs.forEach(x=>{if(x.type==='vente')x.l.forEach(l=>{if(l.p===nom&&!(l.pu>0))l.pu=prix})})}
function stampPu(d,lines){lines.forEach(l=>{const r=d.recs.find(r=>r.nom===l.p);if(r&&r.ttc>0)l.pu=r.ttc});return lines}
/* Avant toute modification d'une recette, fige l'ancienne composition sur les ventes déjà enregistrées */
/* ---------- carte : produits, préparations, formules ----------
   d.recs : produits de la carte {nom, cat, ttc, tva?, since?, l:[{i,g,pes?}]} ; une ligne vise un ingrédient ou une préparation.
   Formule : {nom, kind:'formule', cat, ttc, tva?, slots:[{cat, choix:[noms]}]} ; choix vide = tous les produits de la catégorie.
   d.preps : préparations de base {id, nom, y: poids obtenu en g (vide = somme des lignes), l:[{i,g}]}. */
function tvaOf(d,r){return r&&r.tva!=null&&r.tva!==''?+r.tva:+d.tva}
function ingMap(d){const m={};d.ings.forEach(i=>m[i.id]=i);return m}
function prepOf(d,id){return (d.preps||[]).find(p=>p.id===id)}
function prepYield(p){const y=+p.y;return y>0?y:(p.l||[]).reduce((s,l)=>s+(+l.g||0),0)}
/* Déplie des lignes de recette en ingrédients bruts : une préparation est remplacée par ses ingrédients, au prorata du poids utilisé */
function rawLines(d,lines,ing,f=1,depth=0){const out=[];(lines||[]).forEach(l=>{const g=(+l.g||0)*f,pes=l.pes>0?l.pes*f:null;

function drifts(d){
  const out=[];const ms=monthsOf(d);if(ms.length<2)return out;
  d.ings.forEach(i=>{const pr={};d.docs.forEach(x=>{if(x.type!=='achat')return;x.l.forEach(l=>{if(l.i!==i.id||!l.q)return;const m=x.date.slice(0,7);const p=pr[m]||(pr[m]={q:0,ht:0});p.q+=+l.q;p.ht+=+l.ht})});
    const k=Object.keys(pr).sort();if(k.length<2)return;const a=pr[k[0]],b=pr[k[k.length-1]];const p0=a.ht/a.q,p1=b.ht/b.q;const pct=(p1/p0-1)*100;
    if(Math.abs(pct)>=3)out.push({nom:i.nom,pct,m0:k[0],m1:k[k.length-1],p0,p1})});
  return out.sort((a,b)=>Math.abs(b.pct)-Math.abs(a.pct))
}

/* Mois proposés pour l'inventaire : de l'ouverture (mois avant le premier document) jusqu'au mois en cours */
function invMonths(d){const all=monthsOf(d),cur=new Date().toISOString().slice(0,7);let a=prevMonth(all.length?all[0]:cur);
  const end=[all[all.length-1]||cur,cur].sort()[1];const out=[];while(a<=end&&out.length<60){out.push(a);a=nextMonth(a)}return out}

    const pq=prev&&prev[i.id]?+prev[i.id].q:null;

  const val=invVal(d,invM),pv=stockVal(d,pm),tot=d.stocks&&d.stocks[invM]!=null&&d.stocks[invM]!==''?+d.stocks[invM]:null;
  const hr=d.ings.filter(i=>i.hr).length;
  const sum=ms.slice().reverse().map(m=>{const k=stockSrc(d,m),c=invOf(d,m);return `<tr><td>${mlab(m)}${m===ms[0]?' <span class="small mut">(ouverture)</span>':''}</td><td>${k==='inv'?pill('ok','Inventaire détaillé · '+Object.keys(c).length+' produits'):k==='total'?pill('nt','Total saisi'):pill('wn','Aucun')}</td><td class="n">${k?eur(stockVal(d,m),2):'–'}</td><td><button class="g" data-invmb="${m}">${m===invM?'Affiché':'Ouvrir'}</button></td></tr>`}).join('');
  return `${banner?`<div class="banner" role="status">${banner}</div>`:''}

  <div class="grid">
   <div class="kpi"><div class="l">Stock fin ${mlab(invM)}</div><div class="v">${val!=null?eur(val,2):(tot!=null?eur(tot,2):'–')}</div><div class="s">${src==='inv'?'inventaire détaillé':src==='total'?'total saisi':'pas encore saisi'}</div></div>
   <div class="kpi"><div class="l">Produits comptés</div><div class="v">${n}/${ings.length}</div><div class="s">${n?'les autres comptent pour 0':'inventaire non commencé'}</div></div>
   <div class="kpi"><div class="l">Variation sur le mois</div><div class="v">${val!=null&&pv!=null?(val-pv>=0?'+':'−')+eur(Math.abs(val-pv),2):'–'}</div><div class="s">${pv!=null?'stock fin '+mlab(pm)+' : '+eur(pv,2):'stock de '+mlab(pm)+' inconnu'}</div></div>
  </div>
  <div class="card"><div class="sec"><h3>Inventaire de fin ${mlab(invM)}</h3><span class="row">${prev?`<button class="g" id="invcopy">Reprendre les quantités de ${mlab(pm)}</button>`:''}${src==='inv'?'<button class="x" id="invclr">Effacer cet inventaire</button>':''}</span></div>
   ${tot!=null&&val!=null?`<div class="note" style="margin-bottom:8px">Un total de ${eur(tot,2)} avait été saisi pour ce mois dans le Tableau de bord. L'inventaire détaillé (${eur(val,2)}) le remplace dans les calculs.</div>`:''}
   <div class="tw"><table><thead><tr><th>Produit</th><th>Unité de facture</th><th class="n">Prix HT / unité</th><th class="n">Mois précédent</th><th class="n">Quantité en stock</th><th class="n">Valeur HT</th></tr></thead><tbody>${rows||'<tr><td colspan="6" class="mut">Aucun produit. Ajoute des factures ou des ingrédients d\'abord.</td></tr>'}</tbody>

function bilan(d,r,tot,dr){
  const c=cible(d);const L=[];
  L.push(`Bilan ${d.nom} · ${mlab(period)}`);
  L.push(`CA HT ${eur(r.ca)} · achats HT ${eur(r.achatsHT)}${r.stk!=null?' (variation de stock '+(r.stk>=0?'+':'−')+eur(Math.abs(r.stk))+')':''} · ratio matière réel ${pc(r.ratioReel)} (cible ${pc(c.val)}, théorique ${pc(r.ratioTheo)}).`);
  const top=r.ecarts.filter(e=>e.al==='bd').sort((a,b)=>b.val-a.val).slice(0,3);
  if(top.length)L.push('Surconsommations : '+top.map(e=>`${e.i.nom} ${pc(e.ec)} (${eur(e.val)})`).join(' ; ')+'.');
  const cs=Object.values(r.cats).filter(o=>o.ca>0).sort((a,b)=>b.ca-a.ca);
  if(cs.length>1)L.push('Par catégorie (ratio réel estimé) : '+cs.map(o=>`${o.cat} ${pc(o.ratioR)}`).join(', ')+'.');
  if(r.couv)L.push(`${fmt(r.couv,0)} couverts : ticket moyen ${eur(r.ca/r.couv,2)} HT, matière ${eur(r.conso/r.couv,2)} par couvert.`);
  const ab=Object.values(r.pizzas).filter(z=>z.ratioR>c.val);
  if(ab.length)L.push('Produits au-dessus de la cible : '+ab.map(z=>`${z.nom} ${pc(z.ratioR)}`).join(', ')+'.');
  if(dr.length)L.push('Prix d\'achat en hausse : '+dr.filter(x=>x.pct>0).slice(0,4).map(x=>`${x.nom} +${fmt(x.pct,1)} %`).join(', ')+'.');
  const fa=r.ecarts.filter(e=>e.al==='nt').map(e=>e.i.nom);
  if(fa.length)L.push('Écarts non conclusifs (volume faible) : '+fa.join(', ')+'.');
  L.push('Les achats ne sont pas la consommation exacte (stock, pertes). Estimations à valider avec le patron, aucun gain n\'est garanti.');
  return L.join('\n')
}

function vSimulation(){
  const d=D(),r=calc(d,'all'),c=cible(d);
  const nm=Math.max(1,r.all.length);
  let gain=0;
  const rows=Object.values(r.pizzas).sort((a,b)=>(a.formule-b.formule)||a.cat.localeCompare(b.cat)).map(z=>{
    const nt=d.sim[z.nom]!=null?+d.sim[z.nom]:z.ttc;const nht=nt/z.hf;
    const q=(r.V[z.nom]||0)/nm;const g=q*12*(nht-z.ht);gain+=g;
    const ratioN=nht?z.costR/nht*100:null;
    let sug=Math.ceil(z.costR/(c.val/100)*z.hf*2)/2;
    const al=ratioN>c.val?['bd','Encore au-dessus']:(nt>z.ttc*1.15?['wn','Hausse forte, vérifie le marché']:['ok','Dans la cible']);
    return `<tr><td>${esc(z.nom)}</td><td>${esc(z.cat)}</td><td class="n">${fmt(z.ttc)}</td><td class="n">${pc(z.ratioR)}</td><td class="n"><input class="n" type="number" step="0.5" data-sim="${esc(z.nom)}" value="${nt}"></td><td class="n">${pc(ratioN)}</td><td class="n">${fmt(sug,2)}</td><td class="n">${fmt(q,0)}</td><td class="n ${g>=0?'good':'bad'}">${g>=0?'+':''}${eur(g)}</td><td>${pill(al[0],al[1])}</td></tr>`}).join('');
  return `<h2>Simulation de nouveaux prix</h2>
  <div class="grid"><div class="kpi"><div class="l">Gain annuel estimé</div><div class="v ${gain>=0?'good':'bad'}">${gain>=0?'+':''}${eur(gain)}</div><div class="s">marge HT, ventes stables</div></div></div>

  <div class="row" style="margin-top:10px"><button id="apply">Appliquer ces prix à la carte</button><button class="g" id="reset">Remettre les prix actuels</button></div></div>`
}

function vDonnees(){

function focusKey(a){
  if(!a||a===document.body||!a.closest||!a.closest('#main,header'))return null;
  if(a.id)return '#'+CSS.escape(a.id);
  const ds=Object.entries(a.dataset);if(!ds.length)return null;
  return a.tagName.toLowerCase()+ds.map(([k,v])=>`[data-${k.replace(/[A-Z]/g,c=>'-'+c.toLowerCase())}="${CSS.escape(v)}"]`).join('')}
function render(){
  /* Pendant un événement « change » (Tab ou clic ailleurs), le navigateur n'a pas encore déplacé le curseur :
     on redessine juste après, pour retrouver le champ où il est allé */
  if(window.event&&window.event.type==='change'){clearTimeout(render.t);render.t=setTimeout(render,0);return}
  clearTimeout(render.t);
  const a=document.activeElement,key=focusKey(a),sel=a&&key?(()=>{try{return [a.selectionStart,a.selectionEnd]}catch(e){return null}})():null;
  const box=[...document.querySelectorAll('#main .pz,#main .tw')].map(e=>[e.scrollTop,e.scrollLeft]),sy=window.scrollY,same=render.v===view;
  render0();render.v=view;
  if(!same)return;
  document.querySelectorAll('#main .pz,#main .tw').forEach((e,k)=>{if(box[k]){e.scrollTop=box[k][0];e.scrollLeft=box[k][1]}});
  if(Math.abs(window.scrollY-sy)>1)window.scrollTo(0,sy);
  if(key){let n=null;try{n=document.querySelector(key)}catch(e){}
    if(n&&n!==document.activeElement){n.focus({preventScroll:true});if(sel&&sel[0]!=null)try{n.setSelectionRange(sel[0],sel[1])}catch(e){}}}
}

function pdfPlan(d,r,c){
  const nm=Math.max(1,r.ms.length),hf=1+d.tva/100,acts=[];
  const ex=r.ecarts.filter(e=>e.conclu&&e.ec>0).map(e=>({e,v:Math.max(0,(e.ag-e.t*(1+d.perte/100))*e.i.prix/e.i.g)/nm*12})).filter(x=>x.v>0).sort((a,b)=>b.v-a.v).slice(0,3);
  if(ex.length)acts.push({t:'Maîtriser les portions et les commandes',x:ex.map(x=>x.e.i.nom+' ('+(x.e.ec>0?'+':'')+fmt(x.e.ec,0)+' % d\'achats au-dessus de la théorie)').join(' ; ')+'. Peser les portions en service et ajuster les commandes.',v:ex.reduce((s,x)=>s+x.v,0)});
  /* les formules sont volontairement moins chères que la carte : pas de hausse proposée automatiquement */
  const rows=Object.values(r.pizzas).filter(z=>!z.formule&&z.ratioR>c.val).map(z=>{const q=(r.V[z.nom]||0)/nm;const sug=Math.ceil(z.costR/(c.val/100)*z.hf*2)/2;return {z,sug,q,g:q*12*(sug/z.hf-z.ht),ra:z.costR/(sug/z.hf)*100}}).filter(x=>x.sug>x.z.ttc).sort((a,b)=>b.g-a.g);
  if(rows.length)acts.push({t:'Ajuster le prix des produits au-dessus de la cible',x:rows.map(x=>x.z.nom+' ('+fmt(x.z.ttc)+' € vers '+fmt(x.sug)+' € TTC)').join(' ; ')+'.',v:rows.reduce((s,x)=>s+x.g,0)});
  const dr=drifts(d).filter(x=>x.pct>0).slice(0,3);
  if(dr.length)acts.push({t:'Suivre et répercuter les hausses des fournisseurs',x:dr.map(x=>x.nom+' (+'+fmt(x.pct,1)+' %)').join(' ; ')+'. Renégocier ou répercuter sur la carte.',v:null});
  return {acts,rows}
}

async function handleFiles(files){
  for(const f of files){const x={id:uid(),name:f.name,status:'lecture'};drafts.push(x);render();
    try{const res=await analyse(f);const at=drafts.indexOf(x);
      const nd=res.map((r,k)=>({id:uid(),name:res.length>1?f.name+' ('+(k+1)+'/'+res.length+')':f.name,status:'ok',doc:r.doc,note:r.note}));
      drafts.splice(at,1,...nd)}
    catch(e){x.status='err';const c=e&&e.code;x.msg=c==='not_granted'?'Tu as refusé l\'envoi à Claude. Recharge la page et accepte quand la fenêtre apparaît.':c==='rate_limited'?'Trop de demandes, attends une minute.':((c?'['+c+'] ':'')+((e&&e.message)||'Lecture impossible.'))}
    render()}
}
async function shrink(f){const bm=await createImageBitmap(f);const sc=Math.min(1,1600/Math.max(bm.width,bm.height));const c=document.createElement('canvas');c.width=Math.round(bm.width*sc);c.height=Math.round(bm.height*sc);c.getContext('2d').drawImage(bm,0,0,c.width,c.height);return new Promise(r=>c.toBlob(r,'image/jpeg',0.85))}
async function readPdf(f,imgOk){
  const lib=window.pdfjsLib;if(!lib)throw new Error('Le lecteur de PDF n\'a pas chargé. Réessaie ou envoie une photo du document.');
  lib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  /* isEvalSupported:false neutralise la faille CVE-2024-4367 de pdf.js 3.x (code exécuté depuis un PDF piégé) */
  const doc=await lib.getDocument({data:new Uint8Array(await f.arrayBuffer()),isEvalSupported:false}).promise;
  const n=Math.min(doc.numPages,14);let text='';
  for(let p=1;p<=n;p++){const pg=await doc.getPage(p);const tc=await pg.getTextContent();let ly=null,ln=[];
    tc.items.forEach(it=>{if(!it.str.trim())return;const y=Math.round(it.transform[5]);if(ly!==null&&Math.abs(y-ly)>3){text+=ln.join(' ; ')+'\n';ln=[]}ly=y;ln.push(it.str.trim())});
    if(ln.length)text+=ln.join(' ; ')+'\n'}
  const images=[];
  if(text.replace(/\s/g,'').length<40&&imgOk){for(let p=1;p<=Math.min(doc.numPages,3);p++){const pg=await doc.getPage(p);const vp=pg.getViewport({scale:1.6});const c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;images.push(await new Promise(r=>c.toBlob(r,'image/jpeg',0.85)))}}
  return {text,images}
}

Produits et formules de la carte connus : ${d.recs.length?d.recs.map(r=>r.nom).join(', '):'(aucun pour l\'instant)'}
Catégories de la carte : ${catList(d).join(', ')||'(aucune)'}
Format : {"documents":[{"type":"achat" ou "vente" ou "inconnu","date":"AAAA-MM-JJ" ou null,"ref":"numéro de facture ou titre","fourn":"nom du fournisseur","total_ht":nombre ou null,"lignes":[{"libelle":"texte lu","ingredient_id":"id connu ou null","produit":"nom exact d'un produit ou d'une formule connus, ou null","quantite":nombre,"montant_ht":nombre ou null,"nom_ingredient":"nom court de l'ingrédient (ex. Mozzarella râpée)","unite":"unité de facturation (carton, kg, sac, boîte, seau, bidon…)","contenu_par_unite":nombre de g, ml ou pièces utilisables par unité, déduit de la désignation (carton de 4 sachets de 2,5 kg = 10000 ; kg vendu au poids réel = 1000 ; carton de 100 boîtes = 100) ou null,"tva":taux en % ou null,"hors_ratio":true si l'article n'est pas alimentaire ou n'entre pas dans les plats (boisson, produit d'entretien, matériel), sinon false}]}]}

ils se créent à part) ; mets pese à null si la pesée n'a pas été faite ; les grammages sont en g, ml ou pièces comme dans le document. Un index ou récapitulatif de factures (une ligne par facture : numéro, date, fournisseur, total HT, sans le détail des lignes) est de type index, sans lignes, avec "factures":[{"ref":"numéro de facture","date":"AAAA-MM-JJ","fourn":"fournisseur","total_ht":nombre ou null}]. Si le fichier est autre chose, renvoie {"documents":[]}. Pour un achat, remplis toujours nom_ingredient, unite, contenu_par_unite et tva à partir de la facture, même si l'ingrédient n'est pas dans la liste connue (ingredient_id est alors null). Pour les autres champs, ne devine pas : mets null si aucun ingrédient ou aucun produit connu ne correspond clairement. Format de date ISO.
${text?'Texte du document :\n'+text:'Le document est fourni en image.'}`;

  <div class="card"><div class="sec"><h3>Journal des prix de la carte</h3></div>${eff.length?`<div class="tw"><table><thead><tr><th>Date</th><th>Produit</th><th class="n">Ancien</th><th class="n">Nouveau</th><th class="n">Ratio avant → après</th><th class="n">Gain / mois</th></tr></thead><tbody>${eff.map(e=>`<tr><td>${esc(e.h.date)}</td><td>${esc(e.h.pizza)}</td><td class="n">${fmt(e.h.from)} €</td><td class="n">${fmt(e.h.to)} €</td><td class="n">${e.z?pc(e.rb)+' → '+pc(e.ra):'–'}</td><td class="n ${e.g>=0?'good':'bad'}">${e.g>=0?'+':''}${eur(e.g)}</td></tr>`).join('')}</tbody></table></div><p class="small mut">Gain estimé sur les ventes mensuelles moyennes, sans effet sur les volumes.</p>`:'<p class="mut">Aucun changement de prix enregistré. Les modifications faites dans Fiches techniques, Simulation ou par import de la carte sont journalisées ici automatiquement.</p>'}</div></div>
  <div class="card"><div class="sec"><h3>Prix d'achat par ingrédient</h3><span class="small mut">prix moyen facturé par unité, trié par variation</span></div>${prow.length?`<div class="tw"><table><thead><tr><th>Ingrédient</th>${all.map(m=>`<th class="n">${mlab(m)}</th>`).join('')}<th class="n">Variation</th></tr></thead><tbody>${prow.map(x=>`<tr><td>${esc(x.i.nom)} <span class="small mut">/ ${esc(x.i.unite)}</span></td>${x.pr.map(v=>`<td class="n">${v==null?'–':fmt(v)+' €'}</td>`).join('')}<td class="n ${x.pct>0?'bad':x.pct<0?'good':''}">${x.pct==null?'–':(x.pct>0?'+':'')+fmt(x.pct,1)+' %'}</td></tr>`).join('')}</tbody></table></div>`:'<p class="mut">Aucune facture enregistrée.</p>'}</div>`}
function vGuide(){
  const d=D(),r=calc(d,'all'),c=cible(d),o=objectif(d);
  const has=r.ca>0;
  const worst=Object.values(r.pizzas).filter(z=>z.ratioR!=null).sort((a,b)=>b.ratioR-a.ratioR)[0];
  const topE=r.ecarts.filter(e=>e.conclu&&e.ec>0).sort((a,b)=>b.val-a.val)[0];
  const rd=d.ings.find(i=>(i.rend||1)<1);
  const topC=Object.values(r.cats).filter(o=>o.ca>0).sort((a,b)=>b.ratioR-a.ratioR)[0];
  const G=[
   {t:'Ratio matière',k:'ratio coût matière food cost',def:'La part du prix de vente HT qui part dans les ingrédients. C\'est le chiffre central de l\'audit : plus il est bas, plus il reste de marge pour payer le personnel, le loyer et le patron. Ici, seul l\'alimentaire compte : les boissons sont exclues.',f:'Ratio = coût matière ÷ prix de vente HT × 100',ex:'Une bavette-frites vendue 19,80 € TTC rapporte 18,00 € HT (TVA 10 %). Si ses ingrédients coûtent 5,40 €, le ratio est 5,40 ÷ 18,00 = 30 %. Sur 100 € de ventes HT, 30 € servent à acheter de la matière.',live:worst?`Ton client : le produit au ratio le plus élevé est ${worst.nom} : ${eur(worst.costR,2)} ÷ ${eur(worst.ht,2)} = ${pc(worst.ratioR)}.`:''},
   {t:'Catégories de la carte',k:'categorie entree plat dessert rubrique',def:'Les rubriques de la carte : entrées, plats, desserts, pizzas… Le ratio par catégorie montre où part la marge. Les plats de viande ou de poisson pèsent souvent plus lourd, les desserts et les entrées moins.',f:'Ratio d\'une catégorie = coût matière des produits vendus de la catégorie ÷ CA HT qui leur revient × 100',ex:'Plats : 9 000 € de matière pour 27 000 € de CA HT, soit 33 %. Desserts : 900 € pour 6 000 €, soit 15 %. Le restaurant gagne sa marge sur les desserts et la perd sur les plats.',live:topC?`Ton client : la catégorie la plus chargée est ${topC.cat}, à ${pc(topC.ratioR)} (${pc(topC.part)} du CA).`:''},
   {t:'Prix HT et TVA',k:'tva ht ttc taxe',def:'La carte affiche des prix TTC. Tous les calculs de marge se font en HT, car la TVA est reversée à l\'État. La restauration sur place et la vente à emporter de plats à consommer tout de suite sont à 10 %. Un produit à un autre taux (5,5 % pour certaines ventes à emporter, par exemple) se règle dans sa fiche technique.',f:'Prix HT = prix TTC ÷ (1 + taux de TVA)',ex:'22 € TTC ÷ 1,10 = 20,00 € HT. Les factures fournisseurs se lisent aussi en HT (5,5 % sur l\'alimentaire).',live:`Taux de vente par défaut pour ce client : ${d.tva} %.`},
   {t:'Coût net au gramme',k:'cout net prix unite contenu rendement',def:'Le prix réel d\'un gramme utilisable d\'un ingrédient. On divise le prix de l\'unité facturée par ce qu\'elle contient vraiment, et par le rendement.',f:'Coût net au g = prix HT de l\'unité ÷ (contenu utile × rendement)',ex:'Une pièce de bavette de 2 kg coûte 34 € : 0,017 € le gramme. 180 g dans l\'assiette coûtent 3,06 €. Ne divise jamais le prix par la quantité commandée : le contenu de l\'unité est ce qui compte.',live:''},
   {t:'Rendement',k:'rendement perte épluchage parage brut net',def:'La part d\'un produit brut qui reste utilisable après épluchage, parage ou désossage. Il sert à ne pas sous-estimer ce qu\'il faut acheter.',f:'Quantité à acheter = grammage de la recette ÷ rendement',ex:'Une recette demande 200 g de pommes de terre épluchées. Avec un rendement de 80 %, il faut acheter 200 ÷ 0,80 = 250 g de pommes de terre brutes. Pour un produit déjà prêt (légumes épluchés, viande parée), le rendement est 100 %.',live:rd?`Ton client : ${rd.nom} a un rendement de ${fmt((rd.rend||1)*100,0)} %.`:''},
   {t:'Préparation de base',k:'preparation sous recette sauce fond pate vinaigrette',def:'Une sous-recette faite à l\'avance et utilisée dans plusieurs plats : sauce, fond, pâte, vinaigrette, crème. On la décrit une fois, avec son poids obtenu, puis on l\'ajoute dans les fiches en grammes. Pour les écarts d\'achats, le logiciel la remplace par ses ingrédients.',f:'Coût au gramme d\'une préparation = coût de ses ingrédients ÷ poids obtenu',ex:'Sauce échalote : 300 g d\'échalotes, 1 litre de fond brun et 100 g de beurre, réduits à 800 g, pour 7,20 € d\'ingrédients : 9 € le kilo. 40 g dans une assiette coûtent 0,36 €.',live:(d.preps||[]).length?`Ton client : ${d.preps.length} préparation(s) de base.`:''},
   {t:'Coût d\'un produit (fiche technique)',k:'fiche technique recette cout theorique',def:'La somme du coût de chaque ingrédient et de chaque préparation de la recette, pour une portion. C\'est le coût théorique : il suppose que la recette est respectée au gramme.',f:'Coût = somme (grammage de la ligne × coût net au gramme)',ex:'Bavette sauce échalote : bavette 180 g, frites 250 g de pommes de terre brutes, sauce échalote 40 g, beurre 10 g. Environ 3,06 + 0,30 + 0,36 + 0,09 = 3,81 €. Avec 18,00 € HT de prix de vente, le ratio est 21,2 %.',live:''},
   {t:'Formule ou menu',k:'formule menu entree plat dessert prix fixe',def:'Plusieurs produits au choix pour un prix fixe : entrée et plat, plat et dessert… Chaque élément est un créneau qui propose une catégorie, ou seulement certains produits de cette catégorie.',f:'Coût de la formule = somme des créneaux, chacun au coût moyen de ses produits, pondéré par leurs ventes à la carte',ex:'Formule midi à 19,90 € TTC, soit 18,09 € HT : entrée au choix (coût moyen 1,60 €) et plat au choix (coût moyen 5,10 €), soit 6,70 € et un ratio de 37 %. C\'est plus qu\'à la carte, et c\'est normal : la formule coûte moins cher au client que l\'entrée et le plat pris séparément.',live:''},
   {t:'Coût réel estimé',k:'cout reel surconsommation pesee',def:'Le coût d\'un produit tel qu\'il est vraiment, quand le cuisinier met plus que la recette. Le logiciel part du coût théorique et le corrige avec la pesée si elle existe, sinon avec la surconsommation constatée sur les achats.',f:'Coût réel = somme (grammage pesé, ou grammage déclaré × (1 + surconsommation)) × coût net au g',ex:'La recette dit 180 g de bavette mais la pesée donne 200 g : la ligne coûte 3,40 € au lieu de 3,06 €. Sur 4 000 bavettes par an, 0,34 € de plus par assiette représente environ 1 360 €.',live:''},
   {t:'Couverts et ticket moyen',k:'couverts clients ticket moyen par couvert',def:'Le nombre de clients servis dans le mois, souvent sur le Z de caisse. Il donne le ticket moyen et le coût matière par couvert, plus parlants pour un restaurant que le nombre de produits vendus.',f:'Ticket moyen HT = CA HT alimentaire ÷ couverts ; matière par couvert = consommation ÷ couverts',ex:'45 000 € HT pour 2 000 couverts : ticket moyen 22,50 € HT. 14 400 € de consommation : 7,20 € de matière par couvert.',live:r.couv?`Ton client : ${fmt(r.couv,0)} couverts, ticket moyen ${eur(r.ca/r.couv,2)} HT, matière ${eur(r.conso/r.couv,2)} par couvert.`:''},
   {t:'Cible de ratio',k:'cible objectif charges',def:'Le ratio matière maximum que le restaurant peut se permettre pour payer toutes ses charges et rémunérer le patron comme il le souhaite. On la calcule en partant de la fin.',f:'Cible = (CA total − charges hors matière − frais proportionnels − achat des boissons) ÷ CA alimentaire × 100. Le CA total compte les boissons : elles paient une partie des charges.',ex:'CA HT alimentaire 540 000 € et boissons 180 000 € par an, soit 720 000 €. Charges 41 000 € par mois, soit 492 000 €. Frais de paiement 1 % du CA total : 7 200 €. Boissons achetées 25 % de leur CA : 45 000 €. Il reste 175 800 € pour les ingrédients, donc une cible de 175 800 ÷ 540 000 = 32,6 %. Sans compter les boissons, on trouverait 7,9 % : une cible impossible.',live:`Ton client : cible ${pc(c.val)} (${c.src}).${o.src!=='cible'?' Objectif convenu : '+pc(o.v)+'.':''}`},
   {t:'Écart à la cible',k:'ecart cible negatif positif',def:'La différence entre le ratio d\'un produit, d\'une catégorie ou du restaurant et la cible. Positif, il mange trop de marge ; négatif, il respecte le budget.',f:'Écart = ratio − cible',ex:'Cible 30 %. Un plat à 33 % : écart de +3 points, à corriger (prix ou grammage). Un dessert à 15 % : écart de −15 points, il est très rentable et finance les autres.',live:''},
   {t:'Ratio théorique',k:'ratio theorique recettes ventes',def:'Le ratio que le restaurant devrait avoir si chaque produit était fait exactement selon sa recette, sans perte ni gaspillage.',f:'Ratio théorique = somme (produits vendus × coût de la recette) ÷ CA HT × 100',ex:'3 000 produits vendus pour 45 000 € de CA HT. Les recettes coûtent 12 600 € au total : ratio théorique 28 %.',live:has?`Ton client : ${eur(r.theoCost)} ÷ ${eur(r.ca)} = ${pc(r.ratioTheo)}.`:''},
   {t:'Ratio réel',k:'ratio reel achats',def:'Le ratio constaté dans la réalité, à partir de ce qui a été acheté. Il inclut les pertes, les portions trop généreuses, les erreurs et le gaspillage.',f:'Ratio réel = (achats HT + stock début − stock fin) ÷ CA HT × 100. Sans stock saisi : achats HT ÷ CA HT. Les articles hors ratio (boissons, non alimentaire) sont exclus des achats.',ex:'Achats de 14 400 € pour 45 000 € de CA HT : ratio réel 32 %. Si le ratio théorique est de 28 %, les 4 points d\'écart représentent de la marge qui s\'échappe.',live:has?`Ton client : ${eur(r.conso)} ÷ ${eur(r.ca)} = ${pc(r.ratioReel)}.`:''},
   {t:'Consommation théorique',k:'consommation theorique ventes grammage',def:'La quantité d\'un ingrédient que les ventes auraient dû consommer, selon les recettes. Les préparations de base sont remplacées par leurs ingrédients, et les produits vendus en formule comptent aussi.',f:'Théorique = somme (produits vendus × grammage de la recette) ÷ rendement',ex:'400 bavettes de 180 g : 72 kg de bavette théoriques.',live:''},
   {t:'Écart achats contre théorie',k:'ecart achats theorique surconsommation pertes',def:'La comparaison entre ce qui a été acheté et ce que les ventes justifient. Un écart positif signifie que plus de produit est entré que ce qui est sorti dans les assiettes.',f:'Écart % = (achats en g ÷ théorique en g − 1) × 100',ex:'Théorique 72 kg de bavette, achetés 81 kg : écart de +12,5 %. La valeur de l\'écart est la différence en grammes multipliée par le prix : 9 kg × 17 € = 153 €.',live:topE?`Ton client : ${topE.i.nom} : ${pc(topE.ec)} d'écart, soit environ ${eur(topE.val)}.`:''},
   {t:'Pertes ordinaires',k:'pertes ordinaires 4 % gaspillage',def:'Une part de perte normale (fins de bac, erreurs rares, dégustation) qu\'on ne cherche pas à supprimer. Le logiciel la retire pour ne garder que la vraie surconsommation.',f:'Écart hors pertes = achats − théorique × (1 + pertes ordinaires)',ex:`Avec ${d.perte} % de pertes ordinaires, 100 kg théoriques justifient jusqu'à ${100+(+d.perte)} kg d'achats. Ce qui dépasse est une surconsommation à traiter. Le taux se règle dans Ingrédients et données.`,live:''},
   {t:'Volume trop faible pour conclure',k:'volume faible fausse alerte carton',def:'Quand un produit est acheté par conditionnements entiers et en petite quantité, l\'écart apparent peut venir uniquement du rythme des commandes. Le logiciel te prévient pour éviter une fausse accusation.',f:'Alerte si la consommation théorique de la période est sous le volume minimum (réglable)',ex:'Un bocal de 500 g de pesto commandé deux fois pendant que les recettes n\'en justifient que 600 g : +67 % d\'écart, mais sur deux commandes seulement. À surveiller sur plusieurs mois, pas à reprocher.',live:''},
   {t:'Marge brute par produit',k:'marge brute produit plat',def:'Ce qui reste d\'un produit vendu une fois payés les ingrédients. Ce n\'est pas le bénéfice : il faut encore payer le personnel, le loyer et les autres charges.',f:'Marge = prix HT − coût réel',ex:'Plat à 18,00 € HT et 5,40 € de matière : 12,60 € de marge brute.',live:''},
   {t:'Prix conseillé',k:'prix conseille simulation cible arrondi',def:'Le prix TTC minimum qui ramènerait le produit à la cible, arrondi au 0,50 € supérieur.',f:'Prix conseillé = coût réel ÷ cible × (1 + TVA), arrondi au 0,50 € supérieur',ex:'Coût réel 6,10 €, cible 30 % : 6,10 ÷ 0,30 = 20,33 € HT, soit 22,37 € TTC, donc 22,50 €. C\'est un repère, pas une obligation : le prix doit rester acceptable pour les clients.',live:''},
   {t:'Gain annuel estimé',k:'gain annuel simulation ventes stables',def:'L\'effet d\'une hausse de prix sur un an, si les clients achètent autant qu\'avant. Ce n\'est pas une promesse : une hausse peut faire baisser les ventes.',f:'Gain = ventes moyennes par mois × 12 × (nouveau prix HT − ancien prix HT)',ex:'300 plats par mois, prix de 18,00 € à 19,00 € TTC : 1,00 ÷ 1,10 × 300 × 12 = 3 273 € par an.',live:''},
   {t:'Marge perdue par rapport à l\'objectif',k:'marge perdue objectif mois par mois',def:'Ce qu\'aurait gagné le restaurant un mois donné s\'il avait tenu le ratio objectif.',f:'Marge perdue = (ratio réel − objectif) ÷ 100 × CA HT du mois',ex:'Ratio réel de 33 %, objectif 30 %, CA de 45 000 € : 3 % de 45 000 = 1 350 € perdus ce mois-là.',live:''},
   {t:'Dérive des prix d\'achat',k:'derive prix hausse fournisseur historique',def:'L\'évolution du prix facturé par les fournisseurs d\'un mois à l\'autre. Une hausse non répercutée sur la carte grignote la marge sans que personne ne la voie.',f:'Variation = prix du dernier mois ÷ prix du premier mois − 1',ex:'Beurre doux à 9,20 € le kilo en août et 9,90 € en octobre : +7,6 %.',live:''},
   {t:'Pesée',k:'pesee grammage déclaré balance portion',def:'On pèse les portions réellement servies en service pour les comparer à la recette. C\'est la preuve la plus parlante pour un patron : « tu mets 200 g, la recette dit 180 g ».',f:'Surcoût par portion = (pesé − déclaré) × coût net au gramme',ex:'+20 g de bavette à 0,017 € le gramme = 0,34 € par assiette. Avec 330 bavettes par mois, 112 € par mois sur cet ingrédient seul.',live:''},
  ];
  const steps=[
   ['Cadrage','Onglet Cadrage : saisis les charges mensuelles du patron (ou dépose la fiche de cadrage). La cible de ratio est calculée.'],
   ['Factures','Onglet Documents : dépose les factures fournisseurs. Le logiciel crée les ingrédients et leurs prix. Coche « Hors ratio » pour les boissons et le non-alimentaire. Vérifie chaque ligne avant d\'ajouter.'],
   ['Carte et recettes','Dépose la carte. Dans Fiches techniques, crée d\'abord les préparations de base (sauces, fonds, pâtes), puis les fiches des produits, chacun dans sa catégorie. Ajoute enfin les formules et menus. Contrôle les grammages et les rendements des produits bruts.'],
   ['Ventes','Dépose le relevé de ventes de chaque mois, sans les boissons, avec le nombre de couverts. Un relevé par mois, pas deux.'],
   ['Stocks','Chaque fin de mois, onglet Stocks : compte les produits en réserve (ou saisis seulement la valeur totale dans le Tableau de bord). Fais aussi l\'inventaire d\'ouverture, le mois avant le premier relevé.'],
   ['Contrôle','Lis la carte « Contrôle de la qualité » et corrige tout ce qui est en rouge avant d\'interpréter les chiffres.'],
   ['Lecture','Tableau de bord et ratio par catégorie, puis Écarts, Pesées et Fiches techniques pour comprendre d\'où viennent les écarts.'],
   ['Décision','Onglet Simulation : teste de nouveaux prix, puis applique-les à la carte. Télécharge le bilan PDF pour le patron.']];
  const tabs=[['Tableau de bord','Le résumé du mois : ratios, ratio par catégorie, couverts, évolution, alertes, suivi des documents reçus.'],['Documents','Ajout des factures et ventes (manuel, copier-coller ou lecture automatique), contrôle qualité, contrôle des factures.'],['Stocks','Inventaire de fin de mois, produit par produit, valorisé au prix HT.'],['Fiches techniques','La carte par catégorie, les préparations de base et les formules : coûts, ratios et marges.'],['Écarts','Achats contre théorie, dérive des prix, bilan à copier ou à télécharger en PDF.'],['Pesées','Portions pesées contre recettes et leur coût.'],['Historique','Ratio par mois, journal des changements de prix, prix d\'achat dans le temps.'],['Simulation','Nouveaux prix, nouveau ratio, gain annuel, prix conseillé.'],['Cadrage','Charges du patron, cible et objectif.'],['Ingrédients et données','Prix de référence, contenus, rendements, réglages, sauvegarde.']];
  const pieges=['Un relevé de ventes ajouté deux fois double le chiffre d\'affaires. Le logiciel prévient, mais vérifie.','Une boisson laissée dans les ventes ou dans les achats fausse le ratio : ne saisis pas les ventes de boissons et coche « Hors ratio » pour les boissons achetées.','Un produit vendu avant sa mise à la carte est presque toujours une erreur de lecture.','Un rendement oublié à 100 % sur un produit brut gonfle les écarts.','Une préparation sans poids obtenu est comptée au poids de ses ingrédients crus : une sauce réduite paraît alors moins chère qu\'elle n\'est.','Une formule dont un créneau est vide a un coût sous-estimé : vérifie sa composition.','Un prix divisé par la mauvaise quantité fausse tout : utilise le contenu de l\'unité, pas la quantité commandée.','Une facture en kg lue en grammes (ou l\'inverse) donne un écart de 1 000 fois.','Deux ingrédients pour le même produit (« Crème » et « Crème fraîche 30 % ») séparent achats et recettes.'];
  const limits=['Sans stock saisi, les achats ne sont pas la consommation exacte : saisis le stock de fin de mois pour corriger le ratio.','Le chiffre d\'affaires utilise le prix de chaque produit au moment de la vente, et les ventes passées gardent la recette en vigueur à ce moment-là.','Le coût d\'une formule suppose que ses clients choisissent comme ceux de la carte. Si un plat se vend surtout en formule, son poids réel peut différer.','Les chiffres sont des estimations à valider avec le patron et son comptable. Aucun gain n\'est garanti.','La lecture automatique des documents peut se tromper : tu vérifies toujours avant d\'ajouter.','La cible est provisoire : à réviser tous les 6 mois ou quand les charges changent.'];
  return `<h2>Guide d'utilisation</h2>
  <div class="card"><h3>Comment lire ce logiciel en une phrase</h3><p style="margin:8px 0 0;max-width:70ch">Le logiciel compare trois choses : <b>ce que les recettes devraient coûter</b>, <b>ce que le restaurant a vraiment acheté</b> et <b>ce que le patron peut se permettre</b> (la cible). Chaque écart entre ces trois chiffres est une piste pour gagner de la marge.</p></div>
  <div class="card"><div class="sec"><h3>Utiliser le logiciel, dans l'ordre</h3><span class="small mut">pour un nouveau client</span></div><div class="list">${steps.map((x,k)=>`<div class="item"><span class="pill nt">${k+1}. ${x[0]}</span><span>${x[1]}</span></div>`).join('')}</div>
  <p class="small mut" style="margin-top:10px">Chaque mois ensuite : ajoute le relevé de ventes et les factures, regarde le contrôle qualité, puis le tableau de bord.</p></div>
  <div class="card"><div class="sec"><h3>À quoi sert chaque onglet</h3></div><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(260px,1fr))">${tabs.map(x=>`<div><b>${x[0]}</b><div class="mut">${x[1]}</div></div>`).join('')}</div></div>
  <div class="card"><div class="sec"><h3>Lire les couleurs</h3></div><div class="row">${pill('ok','Vert : dans la cible ou conforme')}${pill('wn','Orange : à vérifier')}${pill('bd','Rouge : au-dessus de la cible ou à corriger')}${pill('nt','Bleu-vert : information, pas un problème')}</div></div>
  <div class="card"><div class="sec"><h3>Comprendre chaque calcul</h3><span class="small mut">cherche un mot ou ouvre une fiche</span></div>
   <input id="gq" type="search" placeholder="Ex. ratio, rendement, marge, TVA…" aria-label="Chercher dans le glossaire" style="width:100%;max-width:420px;margin-bottom:10px">
   <div class="list" id="gl">${G.map((g,k)=>`<details class="gl card" style="padding:10px 14px" data-s="${esc(norm(g.t+' '+g.k+' '+g.def))}" ${k===0?'open':''}><summary style="cursor:pointer;font-weight:600">${esc(g.t)}</summary><div class="list" style="margin-top:8px"><div>${esc(g.def)}</div><div class="note" style="border-color:var(--acc);background:var(--acc2)"><b>Formule :</b> ${esc(g.f)}</div><div><b>Exemple :</b> ${esc(g.ex)}</div>${g.live?`<div class="banner">${esc(g.live)}</div>`:''}</div></details>`).join('')}</div><p class="mut" id="gnone" hidden>Aucun terme ne correspond.</p></div>

    if(t.dataset.drpz!=null){const p=x.doc.pizzas[+t.dataset.drpz],c=t.dataset.drpc;if(t.dataset.drpl!=null){const l=p.lines[+t.dataset.drpl];l[c]=(c==='i')?t.value:(parseNum(t.value)||0)}else p[c]=(c==='nom'||c==='cat')?t.value:(parseNum(t.value)||0);return render()}
    if(t.dataset.drcad){x.doc.cad[t.dataset.drcad]=parseNum(t.value)||0;return}
    if(t.dataset.drf)x.doc[t.dataset.drf]=t.value;
    else{const l=x.doc.lines[+t.dataset.drl],c=t.dataset.drc;l[c]=(c==='q'||c==='ht')?parseNum(t.value):t.value}
    return render()}
  if(t.id==='cl'){drafts=[];S.cur=t.value;period='all';rec=null;banner=null;save();return render()}
  if(t.dataset.f){const i=d.ings.find(x=>x.id===t.dataset.i);let v=t.value;if(t.dataset.f==='hr')v=t.checked;else if(t.dataset.f==='nom'||t.dataset.f==='unite'){if(!v.trim())return render()}else{v=parseNum(v);if(!(v>0))return render();if(t.dataset.f==='rend')v=Math.min(v,100)/100}
    return change(()=>i[t.dataset.f]=v,(b,a)=>{const x=b.m[b.m.length-1],y=a.m[a.m.length-1];return x&&y&&x[1]!=null&&y[1]!=null?`Ingrédient modifié. Ratio réel de ${mlab(y[0])} : ${pc(x[1])} → <b>${pc(y[1])}</b>.`:'Ingrédient modifié.'})}
  if(t.id==='rn'){const v=t.value.trim();if(!v||d.recs.some(r=>r.nom===v))return render();return change(()=>{const r=d.recs.find(r=>r.nom===rec),old=r.nom;d.docs.forEach(x=>x.l.forEach(l=>{if(l.p===old)l.p=v}));d.recs.forEach(f=>{if(isFormule(f))(f.slots||[]).forEach(s=>{if(s.choix)s.choix=s.choix.map(n=>n===old?v:n)})});if(d.sim&&d.sim[old]!=null){d.sim[v]=d.sim[old];delete d.sim[old]}if(d.alias&&d.alias.prod)Object.keys(d.alias.prod).forEach(k=>{if(d.alias.prod[k]===old)d.alias.prod[k]=v});r.nom=v;rec=v})}
  if(t.id==='rc'){const v=t.value.trim();if(!v)return render();return change(()=>{const r=d.recs.find(r=>r.nom===rec);r.cat=v;d.cats=d.cats||[];if(!d.cats.includes(v))d.cats.push(v)})}
  if(t.id==='rt')return change(()=>{const r=d.recs.find(r=>r.nom===rec);const v=t.value.trim();if(v==='')delete r.tva;else{const n=parseNum(v);if(n>=0&&n<=30)r.tva=n}});
  if(t.id==='prn'){const v=t.value.trim();if(!v)return render();return change(()=>{prepOf(d,prepSel).nom=v})}
  if(t.id==='pry')return change(()=>editPrep(d,prepSel,p=>{const v=parseNum(t.value);p.y=v>0?v:null}));
  if(t.dataset.ps!=null)return change(()=>editPrep(d,prepSel,p=>p.l[+t.dataset.ps].i=t.value));
  if(t.dataset.pg!=null)return change(()=>editPrep(d,prepSel,p=>p.l[+t.dataset.pg].g=parseNum(t.value)||0));
  if(t.dataset.fsc!=null)return change(()=>editRecette(d,rec,R=>{const sl=R.slots[+t.dataset.fsc];sl.cat=t.value;sl.choix=[]}));
  if(t.dataset.fch!=null)return change(()=>editRecette(d,rec,R=>{const sl=R.slots[+t.dataset.fch];sl.choix=sl.choix||[];if(t.checked){if(!sl.choix.includes(t.value))sl.choix.push(t.value)}else sl.choix=sl.choix.filter(n=>n!==t.value)}));
  if(t.id==='rp')return change(()=>{const r=d.recs.find(r=>r.nom===rec);const v=parseNum(t.value)||0;logPrix(d,r.nom,r.ttc,v);r.ttc=v});
  if(t.id==='rs')return change(()=>{d.recs.find(r=>r.nom===rec).since=t.value||null});
  if(t.dataset.ls!=null)return change(()=>editRecette(d,rec,r=>r.l[+t.dataset.ls].i=t.value));
  if(t.dataset.lp!=null)return change(()=>{const l=d.recs.find(r=>r.nom===rec).l[+t.dataset.lp];const v=parseNum(t.value);if(v>0)l.pes=v;else delete l.pes});
  if(t.dataset.lg!=null)return change(()=>editRecette(d,rec,r=>r.l[+t.dataset.lg].g=parseNum(t.value)||0));
  if(t.dataset.sim){d.sim[t.dataset.sim]=parseNum(t.value);save();return render()}
  if(t.dataset.cad)return change(()=>d.cad[t.dataset.cad]=parseNum(t.value)||0);
  if(t.dataset.bois){const k=t.dataset.bois,v=parseNum(t.value);return change(()=>{d.bois=d.bois||{ca:0,ratio:25};d.bois[k]=k==='ratio'?Math.min(100,Math.max(0,isNaN(v)?25:v)):Math.max(0,v||0)},(b,a)=>`Boissons mises à jour. Cible de ratio : <b>${pc(a.c)}</b> (avant : ${pc(b.c)}).`)}
  if(t.dataset.var)return change(()=>{d.var=d.var||{};d.var[t.dataset.var]=Math.min(100,Math.max(0,parseNum(t.value)||0))});
  if(t.id==='pro_nom'||t.id==='pro_ct'){S.pro=S.pro||{};S.pro[t.id==='pro_nom'?'nom':'ct']=t.value.trim();save();return}
  if(t.id==='pd'){return change(()=>d.peseeDate=t.value||null)}
  if(t.dataset.inv){const id=t.dataset.inv,v=t.value.trim(),n=parseNum(v);if(v!==''&&!(n>=0)){const x=$('#invErr');if(x)x.textContent='Quantité invalide : saisis un nombre positif, par exemple 2,5.';return}
    const m=invM,nx=nextMonth(m);
    return change(()=>{d.inv=d.inv||{};const mm=d.inv[m]=d.inv[m]||{},i=d.ings.find(z=>z.id===id);if(v==='')delete mm[id];else mm[id]={q:n,p:mm[id]&&mm[id].p>0?mm[id].p:(i?i.prix:0)};if(!Object.keys(mm).length)delete d.inv[m]},
      (b,a)=>{const f=k=>{const x=b.m.find(r=>r[0]===k),y=a.m.find(r=>r[0]===k);return x&&y&&y[1]!=null&&x[1]!==y[1]?` Ratio réel de ${mlab(k)} : ${pc(x[1])} → <b>${pc(y[1])}</b>.`:''};return `Stock fin ${mlab(m)} : ${eur(invVal(d,m)||0,2)}.`+f(m)+f(nx)})}
  if(t.dataset.couv){const k=t.dataset.couv,v=t.value.trim(),n=parseNum(v);if(v!==''&&!(n>=0))return render();return change(()=>{d.couv=d.couv||{};if(v==='')delete d.couv[k];else d.couv[k]=Math.round(n)},()=>`Couverts de ${mlab(k)} enregistrés.`)}
  if(t.dataset.stock){const k=t.dataset.stock,v=t.value.trim(),n=parseNum(v);if(v!==''&&!(n>=0))return render();
    return change(()=>{d.stocks=d.stocks||{};if(v==='')delete d.stocks[k];else d.stocks[k]=n},(b,a)=>{const x=b.m.find(r=>r[0]===k),y=a.m.find(r=>r[0]===k);return 'Stock enregistré.'+(x&&y&&y[1]!=null?` Ratio réel de ${mlab(k)} : ${pc(x[1])} → <b>${pc(y[1])}</b>.`:'')})}
  if(t.id==='pf'){pzF=t.value;return render()}
  if(t.id==='po'){onlyP=t.checked;return render()}
  if(t.dataset.pp!=null){return change(()=>{const l=d.recs.find(r=>r.nom===t.dataset.pp).l[+t.dataset.pl];const v=parseNum(t.value);if(v>0)l.pes=v;else delete l.pes})}
  if(t.id==='ob'){const v=t.value.trim();return change(()=>d.objectif=v===''?null:parseNum(v))}
  if(t.id==='co'){const v=t.value.trim();return change(()=>d.cible=v===''?null:parseNum(v))}
  const map={s_nom:['nom',0],s_tva:['tva',1],s_seuil:['seuil',1],s_perte:['perte',1],s_vol:['volmin',1]};
  if(map[t.id]){const [k,n]=map[t.id];return change(()=>d[k]=n?(parseNum(t.value)||0):(t.value.trim()||d.nom))}
});
function route(){const h=location.hash.slice(1);view=TABS.some(t=>t[0]===h)?h:'tableau';banner=view===(route.last||view)?banner:null;route.last=view;render()}
window.addEventListener('hashchange',route);
load();route();initDb();
</script>
