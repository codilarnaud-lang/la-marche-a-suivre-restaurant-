<style>
/* Layout: en-tête fixe (client + onglets), puis une colonne de travail de 1100px max, tableaux défilants dans leur conteneur */
:root{--bg:#f2f5f3;--panel:#fff;--fg:#16201c;--mut:#5b6b64;--line:#dbe3df;--acc:#0f6b54;--acc2:#e7f2ee;--good:#1d7a4d;--warn:#a8650b;--bad:#b83227;--goodbg:#e3f3ea;--warnbg:#fbefd9;--badbg:#fbe4e1;--ink:#0b3d32;--onacc:#fff;
--fd:'Space Grotesk',system-ui,sans-serif;--fb:'Inter',system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1714;--panel:#17221e;--fg:#e8efec;--mut:#9fb0a8;--line:#2a3a34;--acc:#4fc3a1;--acc2:#183228;--good:#59c98c;--warn:#e0a24a;--bad:#f0877d;--goodbg:#173326;--warnbg:#3a2c12;--badbg:#3d1d19;--ink:#bfeadc;--onacc:#06241b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1714;--panel:#17221e;--fg:#e8efec;--mut:#9fb0a8;--line:#2a3a34;--acc:#4fc3a1;--acc2:#183228;--good:#59c98c;--warn:#e0a24a;--bad:#f0877d;--goodbg:#173326;--warnbg:#3a2c12;--badbg:#3d1d19;--ink:#bfeadc;--onacc:#06241b;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:14px/1.5 var(--fb);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
.wrap{max-width:1100px;margin:0 auto}
h1,h2,h3{font-family:var(--fd);margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:20px}h3{font-size:15px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-top:12px;border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.top{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.brand{font:700 20px var(--fd);color:var(--ink)}.brand small{font:500 12px var(--fb);color:var(--mut);margin-left:6px}
.tabs{display:flex;gap:2px;overflow-x:auto;margin-top:8px;scrollbar-width:thin}
.tabs a{padding:9px 13px;color:var(--mut);text-decoration:none;white-space:nowrap;border-bottom:3px solid transparent;font-weight:500}
.tabs a.on{color:var(--ink);border-color:var(--acc)}
main{padding-top:18px;display:grid;gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px;min-width:0}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.grid2{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.kpi{padding:14px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.kpi .l{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.kpi .v{font:700 26px var(--fd);font-variant-numeric:tabular-nums;margin-top:2px}
.kpi .s{font-size:12px;color:var(--mut)}
.sec{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.mut{color:var(--mut)}.small{font-size:12px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);font-weight:600}
td.n,th.n{text-align:right}
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;max-width:100%}
input.n{text-align:right;width:92px}input.w{width:100%;min-width:140px}
textarea{width:100%;font-family:ui-monospace,monospace;font-size:12px}
:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
button{background:var(--acc);color:var(--onacc);border:0;border-radius:6px;padding:7px 13px;cursor:pointer;font-weight:600}
button.g{background:transparent;color:var(--acc);border:1px solid var(--line)}
button.x{background:transparent;color:var(--bad);border:0;padding:4px 8px}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600}
.ok{background:var(--goodbg);color:var(--good)}.wn{background:var(--warnbg);color:var(--warn)}.bd{background:var(--badbg);color:var(--bad)}.nt{background:var(--acc2);color:var(--ink)}
.good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}
.banner{border:1px solid var(--acc);background:var(--acc2);color:var(--ink);border-radius:8px;padding:10px 14px}
.note{border-left:3px solid var(--warn);background:var(--warnbg);padding:8px 12px;border-radius:0 6px 6px 0;font-size:13px}
.list{display:grid;gap:8px}
.item{display:flex;gap:10px;align-items:flex-start}
.item .pill{flex:none;margin-top:1px}
svg text{fill:var(--mut);font:11px var(--fb)}
.mode{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.mode button{background:transparent;color:var(--mut);border-radius:0}.mode button.on{background:var(--acc2);color:var(--ink)}
.pz{display:grid;gap:4px;max-height:520px;overflow:auto}
.pz button{background:transparent;color:var(--fg);text-align:left;border:1px solid transparent;display:flex;justify-content:space-between;gap:8px;font-weight:500}
.pz button.on{background:var(--acc2);border-color:var(--acc)}
.ex{font-size:12px;color:var(--warn)}
.drop{position:relative;display:grid;gap:4px;justify-items:center;padding:22px 16px;border:2px dashed var(--line);border-radius:8px;cursor:pointer;text-align:center}
.drop.over,.drop:hover{border-color:var(--acc);background:var(--acc2)}
.draft{border-top:1px solid var(--line);padding-top:12px;margin-top:12px;display:grid;gap:8px}
.draft select,.draft input{max-width:230px}
</style>

/* ---------- calculs ---------- */
function cadre(d){const a=d.cad;return {tot:(+a.perso||0)+(+a.loyer||0)+(+a.energie||0)+(+a.autres||0)+(+a.verse||0)}}
function monthsOf(d){return [...new Set(d.docs.map(x=>x.date.slice(0,7)))].sort()}
function calc(d,per){
  const ing={};d.ings.forEach(i=>ing[i.id]=i);
  const hf=1+d.tva/100;
  const costG=i=>i.prix/(i.g*(i.rend||1));
  const pizzas={};
  d.recs.forEach(r=>{let c=0;r.l.forEach(l=>{const i=ing[l.i];if(i)c+=l.g*costG(i)});const ht=r.ttc/hf;pizzas[r.nom]={nom:r.nom,ttc:r.ttc,ht,cost:c,ratio:ht?c/ht*100:null,marge:ht-c,lines:r.l}});
  const all=monthsOf(d);const ms=per==='all'?all:[per];
  const V={},A={};let nVentesDocs=0,nAchats=0;
  d.docs.forEach(x=>{const m=x.date.slice(0,7);if(!ms.includes(m))return;
    if(x.type==='vente'){nVentesDocs++;x.l.forEach(l=>V[l.p]=(V[l.p]||0)+(+l.q||0))}
    else{nAchats++;x.l.forEach(l=>{const a=A[l.i]||(A[l.i]={q:0,ht:0});a.q+=+l.q||0;a.ht+=+l.ht||0})}});
  let ca=0,nPizzas=0,theoCost=0;const theo={};
  Object.entries(V).forEach(([p,q])=>{const z=pizzas[p];if(!z)return;ca+=q*z.ht;nPizzas+=q;theoCost+=q*z.cost;
    z.lines.forEach(l=>{const i=ing[l.i];if(!i)return;theo[l.i]=(theo[l.i]||0)+q*l.g/(i.rend||1)})});
  const achatsHT=Object.values(A).reduce((s,a)=>s+a.ht,0);
  const ecarts=d.ings.map(i=>{
    const t=theo[i.id]||0,a=A[i.id],ag=a?a.q*i.g:0,pcs=i.pc;
    const min=pcs?200:d.volmin;
    let ec=t>0?(ag/t-1)*100:null,val=(ag-t)*i.prix/i.g;
    let al='ok',msg='OK';
    if(ag===0&&t===0){al='na';msg='Sans mouvement'}
    else if(t===0){al='wn';msg='Achat sans recette liée'}
    else if(ag/t>3||ag/t<0.3){al='wn';msg='Vérifie les unités'}
    else if(Math.abs(ec)>d.seuil){if(t<min){al='nt';msg='Volume trop faible pour conclure'}else{al=ec>0?'bd':'wn';msg=ec>0?'Écart à analyser':'Achats sous la théorie, vérifie stock'}}
    const conclu=t>=min&&t>0;
    const sur=conclu&&ec!=null?Math.max(0,(ag/t)/(1+d.perte/100)-1):0;
    return {i,t,ag,a,ec,val,al,msg,sur,conclu}});
  const em={};ecarts.forEach(e=>em[e.i.id]=e);
  Object.values(pizzas).forEach(z=>{let c=0;z.lines.forEach(l=>{const i=ing[l.i];if(i){const e=em[i.id];c+=(l.pes>0?l.pes:l.g*(1+(e?e.sur:0)))*costG(i)}});z.costR=c;z.ratioR=z.ht?c/z.ht*100:null});
  return {d,ing,pizzas,V,A,ca,nPizzas,theoCost,achatsHT,ecarts,em,ms,all,nVentesDocs,nAchats,
    ratioReel:ca?achatsHT/ca*100:null,ratioTheo:ca?theoCost/ca*100:null}
}
function cible(d){
  const all=monthsOf(d),ing={};d.ings.forEach(i=>ing[i.id]=i);
  let tot=0,n=0;
  all.forEach(m=>{let s=0,has=false;d.docs.forEach(x=>{if(x.type==='vente'&&x.date.slice(0,7)===m){has=true;x.l.forEach(l=>{const r=d.recs.find(r=>r.nom===l.p);if(r)s+=l.q*r.ttc/(1+d.tva/100)})}});if(has){tot+=s;n++}});
  const ann=n?tot/n*12:0,ch=cadre(d).tot*12;
  const calc=ann&&ch?100-ch/ann*100:null;
  const val=d.cible!=null&&d.cible!==''?+d.cible:(calc!=null?calc:28);
  return {ann,ch,calc,val,src:d.cible!=null&&d.cible!==''?'saisie':(calc!=null?'calcul':'défaut 28 %')}
}
function objectif(d){const c=cible(d);return d.objectif>0?{v:+d.objectif,src:'objectif convenu'}:{v:c.val,src:'cible'}}
function snapshot(d){const c=cible(d);return {m:monthsOf(d).map(m=>{const r=calc(d,m);return [m,r.ratioReel,r.ca]}),c:c.val}}

/* ---------- graphiques ---------- */
function bars(labels,vals,target,unit,opt={}){
  const W=360,H=190,pl=40,pr=10,pt=14,pb=28;
  const mx=Math.max(...vals.filter(v=>v!=null),target||0,1)*1.2,sy=v=>H-pb-(v/mx)*(H-pb-pt);
  const bw=(W-pl-pr)/labels.length;let g='';
  for(let k=0;k<=4;k++){const v=mx*k/4,y=sy(v);g+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${pl-5}" y="${y+4}" text-anchor="end">${fmt(v,opt.dec??0)}</text>`}
  vals.forEach((v,k)=>{if(v==null)return;const x=pl+k*bw+bw*.2,w=bw*.6,y=sy(v);const bad=target!=null&&v>target;
    g+=`<rect x="${x}" y="${y}" width="${w}" height="${H-pb-y}" fill="${bad?'var(--bad)':'var(--acc)'}" rx="2"/><text x="${x+w/2}" y="${y-4}" text-anchor="middle" style="fill:var(--fg);font-weight:600">${fmt(v,opt.dec??1)}</text><text x="${x+w/2}" y="${H-10}" text-anchor="middle">${esc(labels[k])}</text>`});
  if(target!=null){const y=sy(target);g+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="var(--warn)" stroke-width="1.5" stroke-dasharray="5 4"/><text x="${W-pr}" y="${y-4}" text-anchor="end" style="fill:var(--warn)">${esc(opt.tl||'cible')} ${fmt(target,opt.dec??1)}</text>`}
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(opt.al||'graphique')}">${g}</svg>`
}

function drifts(d){
  const out=[];const ms=monthsOf(d);if(ms.length<2)return out;
  d.ings.forEach(i=>{const pr={};d.docs.forEach(x=>{if(x.type!=='achat')return;x.l.forEach(l=>{if(l.i!==i.id||!l.q)return;const m=x.date.slice(0,7);const p=pr[m]||(pr[m]={q:0,ht:0});p.q+=+l.q;p.ht+=+l.ht})});
    const k=Object.keys(pr).sort();if(k.length<2)return;const a=pr[k[0]],b=pr[k[k.length-1]];const p0=a.ht/a.q,p1=b.ht/b.q;const pct=(p1/p0-1)*100;
    if(Math.abs(pct)>=3)out.push({nom:i.nom,pct,m0:k[0],m1:k[k.length-1],p0,p1})});
  return out.sort((a,b)=>Math.abs(b.pct)-Math.abs(a.pct))
}

function bilan(d,r,tot,dr){
  const c=cible(d);const L=[];
  L.push(`Bilan ${d.nom} · ${mlab(period)}`);
  L.push(`CA HT ${eur(r.ca)} · achats HT ${eur(r.achatsHT)} · ratio matière réel ${pc(r.ratioReel)} (cible ${pc(c.val)}, théorique ${pc(r.ratioTheo)}).`);
  const top=r.ecarts.filter(e=>e.al==='bd').sort((a,b)=>b.val-a.val).slice(0,3);
  if(top.length)L.push('Surconsommations : '+top.map(e=>`${e.i.nom} ${pc(e.ec)} (${eur(e.val)})`).join(' ; ')+'.');
  const ab=Object.values(r.pizzas).filter(z=>z.ratioR>c.val);
  if(ab.length)L.push('Pizzas au-dessus de la cible : '+ab.map(z=>`${z.nom} ${pc(z.ratioR)}`).join(', ')+'.');
  if(dr.length)L.push('Prix d\'achat en hausse : '+dr.filter(x=>x.pct>0).slice(0,4).map(x=>`${x.nom} +${fmt(x.pct,1)} %`).join(', ')+'.');
  const fa=r.ecarts.filter(e=>e.al==='nt').map(e=>e.i.nom);
  if(fa.length)L.push('Écarts non conclusifs (volume faible) : '+fa.join(', ')+'.');
  L.push('Les achats ne sont pas la consommation exacte (stock, pertes). Estimations à valider avec le patron, aucun gain n\'est garanti.');
  return L.join('\n')
}

function vSimulation(){
  const d=D(),r=calc(d,'all'),c=cible(d);
  const nm=Math.max(1,r.all.length);
  let gain=0;
  const rows=Object.values(r.pizzas).map(z=>{
    const nt=d.sim[z.nom]!=null?+d.sim[z.nom]:z.ttc;const nht=nt/(1+d.tva/100);
    const q=(r.V[z.nom]||0)/nm;const g=q*12*(nht-z.ht);gain+=g;
    const ratioN=nht?z.costR/nht*100:null;
    let sug=Math.ceil(z.costR/(c.val/100)*(1+d.tva/100)*2)/2;
    const al=ratioN>c.val?['bd','Encore au-dessus']:(nt>z.ttc*1.15?['wn','Hausse forte, vérifie le marché']:['ok','Dans la cible']);
    return `<tr><td>${esc(z.nom)}</td><td class="n">${fmt(z.ttc)}</td><td class="n">${pc(z.ratioR)}</td><td class="n"><input class="n" type="number" step="0.5" data-sim="${esc(z.nom)}" value="${nt}"></td><td class="n">${pc(ratioN)}</td><td class="n">${fmt(sug,2)}</td><td class="n">${fmt(q,0)}</td><td class="n ${g>=0?'good':'bad'}">${g>=0?'+':''}${eur(g)}</td><td>${pill(al[0],al[1])}</td></tr>`}).join('');
  return `<h2>Simulation de nouveaux prix</h2>
  <div class="grid"><div class="kpi"><div class="l">Gain annuel estimé</div><div class="v ${gain>=0?'good':'bad'}">${gain>=0?'+':''}${eur(gain)}</div><div class="s">marge HT, ventes stables</div></div></div>

  <div class="row" style="margin-top:10px"><button id="apply">Appliquer ces prix à la carte</button><button class="g" id="reset">Remettre les prix actuels</button></div></div>`
}

function pdfPlan(d,r,c){
  const nm=Math.max(1,r.ms.length),hf=1+d.tva/100,acts=[];
  const ex=r.ecarts.filter(e=>e.conclu&&e.ec>0).map(e=>({e,v:Math.max(0,(e.ag-e.t*(1+d.perte/100))*e.i.prix/e.i.g)/nm*12})).filter(x=>x.v>0).sort((a,b)=>b.v-a.v).slice(0,3);
  if(ex.length)acts.push({t:'Maîtriser les portions et les commandes',x:ex.map(x=>x.e.i.nom+' ('+(x.e.ec>0?'+':'')+fmt(x.e.ec,0)+' % d\'achats au-dessus de la théorie)').join(' ; ')+'. Peser les portions en service et ajuster les commandes.',v:ex.reduce((s,x)=>s+x.v,0)});
  const rows=Object.values(r.pizzas).filter(z=>z.ratioR>c.val).map(z=>{const q=(r.V[z.nom]||0)/nm;const sug=Math.ceil(z.costR/(c.val/100)*hf*2)/2;return {z,sug,q,g:q*12*(sug/hf-z.ht),ra:z.costR/(sug/hf)*100}}).filter(x=>x.sug>x.z.ttc).sort((a,b)=>b.g-a.g);
  if(rows.length)acts.push({t:'Ajuster le prix des pizzas au-dessus de la cible',x:rows.map(x=>x.z.nom+' ('+fmt(x.z.ttc)+' € vers '+fmt(x.sug)+' € TTC)').join(' ; ')+'.',v:rows.reduce((s,x)=>s+x.g,0)});
  const dr=drifts(d).filter(x=>x.pct>0).slice(0,3);
  if(dr.length)acts.push({t:'Suivre et répercuter les hausses des fournisseurs',x:dr.map(x=>x.nom+' (+'+fmt(x.pct,1)+' %)').join(' ; ')+'. Renégocier ou répercuter sur la carte.',v:null});
  return {acts,rows}
}

    return `<tr><td>${mlab(m)}</td><td class="n">${fmt(r.nPizzas,0)}</td><td class="n">${eur(r.ca)}</td><td class="n">${eur(r.achatsHT)}</td><td class="n"><b>${pc(r.ratioReel)}</b></td><td class="n">${dv==null?'–':`<span class="${dv>0?'bad':'good'}">${dv>0?'▲ +':'▼ '}${fmt(dv,1)} pt</span>`}</td><td class="n">${r.ratioReel==null?'–':(r.ratioReel>o.v?`<span class="bad">+${fmt(r.ratioReel-o.v,1)} pt</span>`:`<span class="good">sous l'objectif</span>`)}</td><td class="n">${r.nPizzas?fmt(r.achatsHT/r.nPizzas,2)+' €':'–'}</td><td class="n">${lost>0?eur(lost):'–'}</td></tr>`}).join('');
  return `<div class="card"><div class="sec"><h3>Mois par mois</h3><span class="small mut">${o.src} : ${pc(o.v)}</span></div><div class="tw"><table><thead><tr><th>Mois</th><th class="n">Pizzas</th><th class="n">CA HT</th><th class="n">Achats HT</th><th class="n">Ratio réel</th><th class="n">Évolution</th><th class="n">Écart objectif</th><th class="n">Achats par pizza</th><th class="n">Marge perdue vs objectif</th></tr></thead><tbody>${rows}</tbody></table></div><p class="small mut">Marge perdue = écart au ratio objectif × chiffre d'affaires du mois. Les achats du mois peuvent inclure du stock, regarde la tendance.</p></div>`}
let pzF='all',onlyP=false;
function vPesees(){
  const d=D(),r=calc(d,'all'),nm=Math.max(1,r.all.length),ing=r.ing;
  const rows=[];let nP=0,nA=0,totM=0;const byIng={};
  d.recs.forEach(z=>{const q=(r.V[z.nom]||0)/nm;z.l.forEach((l,k)=>{const i=ing[l.i];if(!i)return;nA++;const cg=i.prix/(i.g*(i.rend||1));const diff=l.pes>0?l.pes-l.g:null;const cost=diff!=null?diff*cg:null;const m=cost!=null?cost*q:0;if(l.pes>0){nP++;totM+=m;byIng[l.i]=(byIng[l.i]||0)+m}rows.push({z,k,l,i,diff,cost,q,m})})});
  const vis=rows.filter(x=>(pzF==='all'||x.z.nom===pzF)&&(!onlyP||x.l.pes>0));
  const top=Object.entries(byIng).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const cross=Object.keys(byIng).map(id=>{const e=r.em[id];const exc=e&&e.conclu?(e.ag-e.t*(1+d.perte/100))*e.i.prix/e.i.g:null;return {i:ing[id],pes:byIng[id]*nm,exc}}).filter(x=>x.i);
  return `<h2>Pesées en service</h2>

  <div class="kpi"><div class="l">Surcoût mensuel estimé</div><div class="v ${totM>0?'bad':'good'}">${eur(totM)}</div><div class="s">pesées × ventes moyennes</div></div>
  <div class="kpi"><div class="l">Surcoût annuel estimé</div><div class="v ${totM>0?'bad':'good'}">${eur(totM*12)}</div><div class="s">ventes stables</div></div></div>
  <div class="card"><div class="row"><label class="small mut" for="pd">Date de la pesée</label><input type="date" id="pd" value="${esc(d.peseeDate||'')}"><label class="small mut" for="pf">Pizza</label><select id="pf"><option value="all">Toutes</option>${d.recs.map(z=>`<option ${z.nom===pzF?'selected':''}>${esc(z.nom)}</option>`).join('')}</select><label><input type="checkbox" id="po" ${onlyP?'checked':''}> seulement les lignes pesées</label></div>
  <div class="tw" style="margin-top:10px"><table><thead><tr><th>Pizza</th><th>Ingrédient</th><th class="n">Déclaré</th><th class="n">Pesé</th><th class="n">Écart</th><th class="n">Surcoût / pizza</th><th class="n">Ventes / mois</th><th class="n">Surcoût / mois</th></tr></thead><tbody>
  ${vis.map(x=>`<tr><td>${esc(x.z.nom)}</td><td>${esc(x.i.nom)}</td><td class="n">${x.l.g}</td><td class="n"><input class="n" type="number" step="any" data-pp="${esc(x.z.nom)}" data-pl="${x.k}" value="${x.l.pes||''}" placeholder="–"></td><td class="n ${x.diff>0?'bad':''}">${x.diff==null?'–':(x.diff>0?'+':'')+fmt(x.diff,0)+' ('+(x.diff/x.l.g*100>0?'+':'')+fmt(x.diff/x.l.g*100,0)+' %)'}</td><td class="n">${x.cost==null?'–':fmt(x.cost,3)+' €'}</td><td class="n">${fmt(x.q,0)}</td><td class="n">${x.cost==null?'–':eur(x.m)}</td></tr>`).join('')}</tbody></table></div>
  <p class="small mut">Pesée en grammes nets, ingrédient par ingrédient. Le surcoût utilise le prix de référence et le rendement. Dépose la fiche de pesée dans Documents pour la remplir automatiquement.</p></div>
  <div class="grid2"><div class="card"><h3>Les plus gros surcoûts</h3>${top.length?`<div class="list" style="margin-top:8px">${top.map(([id,v])=>`<div class="item"><b>${esc(ing[id].nom)}</b><span>${eur(v)} par mois</span></div>`).join('')}</div>`:'<p class="mut">Aucune pesée renseignée.</p>'}</div>
  <div class="card"><h3>Les pesées expliquent-elles l'écart des achats ?</h3>${cross.length?`<div class="tw"><table><thead><tr><th>Ingrédient</th><th class="n">Expliqué par les pesées</th><th class="n">Écart achats hors pertes</th><th class="n">Reste</th></tr></thead><tbody>${cross.map(x=>`<tr><td>${esc(x.i.nom)}</td><td class="n">${eur(x.pes)}</td><td class="n">${x.exc==null?'volume faible':eur(x.exc)}</td><td class="n">${x.exc==null?'–':eur(x.exc-x.pes)}</td></tr>`).join('')}</tbody></table></div><p class="small mut">Sur toute la période. Un reste élevé signale d'autres pertes (gaspillage, erreurs de commande, vol).</p>`:'<p class="mut">Pas encore de pesée à comparer.</p>'}</div></div>`}
function vHistorique(){
  const d=D(),all=monthsOf(d),hf=1+d.tva/100,rm=all.map(m=>calc(d,m)),r=calc(d,'all'),nm=Math.max(1,all.length);
  const o=objectif(d);
  const hist=(d.hist||[]).slice().sort((a,b)=>b.date.localeCompare(a.date));
  const prow=d.ings.map(i=>{const pr=all.map(m=>{let q=0,h=0;d.docs.forEach(x=>{if(x.type==='achat'&&x.date.slice(0,7)===m)x.l.forEach(l=>{if(l.i===i.id&&l.q>0){q+=+l.q;h+=+l.ht}})});return q?h/q:null});const v=pr.filter(x=>x!=null);return {i,pr,pct:v.length>1?(v[v.length-1]/v[0]-1)*100:null}}).filter(x=>x.pr.some(y=>y!=null)).sort((a,b)=>Math.abs(b.pct||0)-Math.abs(a.pct||0));
  const eff=hist.map(h=>{const z=r.pizzas[h.pizza];const q=(r.V[h.pizza]||0)/nm;return {h,z,rb:z?z.costR/(h.from/hf)*100:null,ra:z?z.costR/(h.to/hf)*100:null,g:q*(h.to-h.from)/hf}});
  return `<h2>Historique</h2>
  <div class="grid2"><div class="card"><div class="sec"><h3>Ratio matière réel par mois</h3><span class="small mut">${o.src} ${pc(o.v)}</span></div>${all.length?bars(all.map(mlab),rm.map(x=>x.ratioReel),o.v,'%',{tl:o.src==='cible'?'cible':'objectif',al:'Ratio par mois'}):'<p class="mut">Aucun mois enregistré.</p>'}</div>
  <div class="card"><div class="sec"><h3>Journal des prix de la carte</h3></div>${eff.length?`<div class="tw"><table><thead><tr><th>Date</th><th>Pizza</th><th class="n">Ancien</th><th class="n">Nouveau</th><th class="n">Ratio avant → après</th><th class="n">Gain / mois</th></tr></thead><tbody>${eff.map(e=>`<tr><td>${esc(e.h.date)}</td><td>${esc(e.h.pizza)}</td><td class="n">${fmt(e.h.from)} €</td><td class="n">${fmt(e.h.to)} €</td><td class="n">${e.z?pc(e.rb)+' → '+pc(e.ra):'–'}</td><td class="n ${e.g>=0?'good':'bad'}">${e.g>=0?'+':''}${eur(e.g)}</td></tr>`).join('')}</tbody></table></div><p class="small mut">Gain estimé sur les ventes mensuelles moyennes, sans effet sur les volumes.</p>`:'<p class="mut">Aucun changement de prix enregistré. Les modifications faites dans Fiches techniques, Simulation ou par import de la carte sont journalisées ici automatiquement.</p>'}</div></div>
  <div class="card"><div class="sec"><h3>Prix d'achat par ingrédient</h3><span class="small mut">prix moyen facturé par unité, trié par variation</span></div>${prow.length?`<div class="tw"><table><thead><tr><th>Ingrédient</th>${all.map(m=>`<th class="n">${mlab(m)}</th>`).join('')}<th class="n">Variation</th></tr></thead><tbody>${prow.map(x=>`<tr><td>${esc(x.i.nom)} <span class="small mut">/ ${esc(x.i.unite)}</span></td>${x.pr.map(v=>`<td class="n">${v==null?'–':fmt(v)+' €'}</td>`).join('')}<td class="n ${x.pct>0?'bad':x.pct<0?'good':''}">${x.pct==null?'–':(x.pct>0?'+':'')+fmt(x.pct,1)+' %'}</td></tr>`).join('')}</tbody></table></div>`:'<p class="mut">Aucune facture enregistrée.</p>'}</div>`}

   {t:'Ratio matière',k:'ratio coût matière food cost',def:'La part du prix de vente HT qui part dans les ingrédients et les emballages. C\'est le chiffre central de l\'audit : plus il est bas, plus il reste de marge pour payer le personnel, le loyer et le patron.',f:'Ratio = coût matière ÷ prix de vente HT × 100',ex:'Une pizza vendue 12 € TTC rapporte 10,91 € HT (TVA 10 %). Si ses ingrédients et sa boîte coûtent 2,80 €, le ratio est 2,80 ÷ 10,91 = 25,7 %. Sur 100 € de ventes HT, 25,70 € servent à acheter de la matière.',live:worst?`Ton client : la pizza au ratio le plus élevé est ${worst.nom} : ${eur(worst.costR,2)} ÷ ${eur(worst.ht,2)} = ${pc(worst.ratioR)}.`:''},
   {t:'Prix HT et TVA',k:'tva ht ttc taxe',def:'La carte affiche des prix TTC (avec TVA). Tous les calculs de marge se font en HT, car la TVA est reversée à l\'État et n\'appartient pas au restaurateur. La vente à emporter de pizzas est à 10 %.',f:'Prix HT = prix TTC ÷ (1 + taux de TVA)',ex:'13 € TTC ÷ 1,10 = 11,82 € HT. Les factures fournisseurs se lisent aussi en HT (5,5 % sur l\'alimentaire, 20 % sur les boîtes).',live:`Taux de vente réglé pour ce client : ${d.tva} %.`},
   {t:'Coût net au gramme',k:'cout net prix unite contenu rendement',def:'Le prix réel d\'un gramme utilisable d\'un ingrédient. On divise le prix de l\'unité facturée par ce qu\'elle contient vraiment, et par le rendement.',f:'Coût net au g = prix HT de l\'unité ÷ (contenu utile × rendement)',ex:'Un carton de mozzarella coûte 62 € et contient 10 000 g : 0,0062 € le gramme. 100 g sur une pizza coûtent 0,62 €. Ne divise jamais le prix par la quantité commandée : le contenu de l\'unité est ce qui compte.',live:''},
   {t:'Rendement',k:'rendement perte épluchage brut net',def:'La part d\'un produit brut qui reste utilisable après épluchage, parage ou égouttage. Il sert à ne pas sous-estimer ce qu\'il faut acheter.',f:'Quantité à acheter = grammage de la recette ÷ rendement',ex:'Une pizza demande 40 g de poivron coupé. Avec un rendement de 85 %, il faut acheter 40 ÷ 0,85 = 47 g de poivron brut. Pour un produit déjà prêt (mozzarella râpée, boîte de champignons égouttés), le rendement est 100 %.',live:rd?`Ton client : ${rd.nom} a un rendement de ${fmt((rd.rend||1)*100,0)} %.`:''},
   {t:'Coût d\'une pizza (fiche technique)',k:'fiche technique recette cout theorique',def:'La somme du coût de chaque ingrédient de la recette, pour une pizza. C\'est le coût théorique : il suppose que la recette est respectée au gramme.',f:'Coût = somme (grammage de la ligne × coût net au gramme)',ex:'Margherita : sauce 80 g, mozzarella 100 g, farine 160 g, huile 5 g, une boîte. Environ 0,13 + 0,62 + 0,14 + 0,03 + 0,24 = 1,16 €. Avec 9,09 € HT de prix de vente, le ratio est 12,8 %.',live:''},
   {t:'Coût réel estimé',k:'cout reel surconsommation pesee',def:'Le coût d\'une pizza tel qu\'il est vraiment, quand le cuisinier met plus que la recette. Le logiciel part du coût théorique et le corrige avec la pesée si elle existe, sinon avec la surconsommation constatée sur les achats.',f:'Coût réel = somme (grammage pesé, ou grammage déclaré × (1 + surconsommation)) × coût net au g',ex:'La recette dit 100 g de mozzarella mais la pesée donne 118 g : la ligne coûte 0,73 € au lieu de 0,62 €. Sur 5 000 pizzas par an, 0,11 € de plus par pizza représente environ 550 €.',live:''},
   {t:'Cible de ratio',k:'cible objectif charges',def:'Le ratio matière maximum que le restaurant peut se permettre pour payer toutes ses charges et rémunérer le patron comme il le souhaite. On la calcule en partant de la fin.',f:'Cible = 100 % − (charges mensuelles hors matière × 12 ÷ CA HT annuel × 100)',ex:'CA HT annuel de 146 500 €. Charges hors matière 9 030 € par mois (personnel 5 200, loyer 700, énergie 450, autres frais 880, rémunération du patron 1 800) soit 108 360 € par an, donc 74 % du CA. Cible = 100 − 74 = 26 %. Au-dessus, le patron ne se paie pas comme prévu.',live:`Ton client : cible ${pc(c.val)} (${c.src}).${o.src!=='cible'?' Objectif convenu : '+pc(o.v)+'.':''}`},
   {t:'Écart à la cible',k:'ecart cible negatif positif',def:'La différence entre le ratio d\'une pizza (ou du restaurant) et la cible. C\'est le signal : positif, la pizza mange trop de marge ; négatif, elle respecte le budget.',f:'Écart = ratio − cible',ex:'Cible 26 %. Une pizza à 27,4 % : écart de +1,4 point, à corriger (prix ou grammage). Une pizza à 14 % : écart de −12 points, elle est très rentable et peut financer les autres.',live:''},

   {t:'Écart achats contre théorie',k:'ecart achats theorique surconsommation pertes',def:'La comparaison entre ce qui a été acheté et ce que les ventes justifient. Un écart positif signifie que plus de produit est entré que ce qui est sorti dans les assiettes.',f:'Écart % = (achats en g ÷ théorique en g − 1) × 100',ex:'Théorique 293 700 g de mozzarella, achetés 360 000 g : écart de +22,6 %. La valeur de l\'écart est la différence en grammes multipliée par le prix : environ 411 €.',live:topE?`Ton client : ${topE.i.nom} : ${pc(topE.ec)} d'écart, soit environ ${eur(topE.val)}.`:''},

   {t:'Volume trop faible pour conclure',k:'volume faible fausse alerte carton',def:'Quand un produit est acheté par cartons entiers et en petite quantité, l\'écart apparent peut venir uniquement du rythme des commandes. Le logiciel te prévient pour éviter une fausse accusation.',f:'Alerte si la consommation théorique de la période est sous le volume minimum (réglable)',ex:'Un carton d\'emmental de 5 kg commandé deux fois pendant que la recette n\'en justifie que 8 kg : +84 % d\'écart, mais sur deux commandes seulement. À surveiller sur plusieurs mois, pas à reprocher.',live:''},
   {t:'Marge brute par pizza',k:'marge brute pizza',def:'Ce qui reste d\'une pizza vendue une fois payés les ingrédients et l\'emballage. Ce n\'est pas le bénéfice : il faut encore payer le personnel, le loyer et les autres charges.',f:'Marge = prix HT − coût réel',ex:'Pizza à 10,91 € HT et 2,80 € de matière : 8,11 € de marge brute.',live:''},
   {t:'Prix conseillé',k:'prix conseille simulation cible arrondi',def:'Le prix TTC minimum qui ramènerait la pizza à la cible, arrondi au 0,50 € supérieur.',f:'Prix conseillé = coût réel ÷ cible × (1 + TVA), arrondi au 0,50 € supérieur',ex:'Coût réel 3,10 €, cible 26 % : 3,10 ÷ 0,26 = 11,92 € HT, soit 13,11 € TTC, donc 13,50 €. C\'est un repère, pas une obligation : le prix doit rester acceptable pour les clients.',live:''},

   {t:'Marge perdue par rapport à l\'objectif',k:'marge perdue objectif mois par mois',def:'Ce qu\'aurait gagné le restaurant un mois donné s\'il avait tenu le ratio objectif.',f:'Marge perdue = (ratio réel − objectif) ÷ 100 × CA HT du mois',ex:'Ratio réel de 21 %, objectif 18 %, CA de 11 400 € : 3 % de 11 400 = 342 € perdus ce mois-là.',live:''},
   {t:'Dérive des prix d\'achat',k:'derive prix hausse fournisseur historique',def:'L\'évolution du prix facturé par les fournisseurs d\'un mois à l\'autre. Une hausse non répercutée sur la carte grignote la marge sans que personne ne la voie.',f:'Variation = prix du dernier mois ÷ prix du premier mois − 1',ex:'Huile d\'olive à 30,20 € le bidon en août et 31,50 € en octobre : +4,3 %.',live:''},

  const limits=['Les achats ne sont pas la consommation exacte : le stock en début et fin de mois joue.','Les chiffres sont des estimations à valider avec le patron et son comptable. Aucun gain n\'est garanti.','La lecture automatique des documents peut se tromper : tu vérifies toujours avant d\'ajouter.','La cible est provisoire : à réviser tous les 6 mois ou quand les charges changent.'];
  return `<h2>Guide d'utilisation</h2>

  <div class="grid2"><div class="card"><h3>Pièges fréquents</h3><ul style="margin:8px 0 0;padding-left:18px;display:grid;gap:6px">${pieges.map(p=>`<li>${p}</li>`).join('')}</ul></div>

document.addEventListener('input',e=>{if(e.target.id!=='gq')return;const q=norm(e.target.value);let n=0;document.querySelectorAll('.gl').forEach(el=>{const ok=!q||el.dataset.s.includes(q);el.hidden=!ok;if(ok)n++;if(q&&ok)el.open=true});const z=$('#gnone');if(z)z.hidden=n>0});
function parseNum(s){return parseFloat(String(s).replace(/\s/g,'').replace(',','.'))}
const normS=s=>norm(s).split(' ').map(w=>w.length>3?w.replace(/s$/,''):w).join(' ');
function findIng(d,n){const k=normS(n);if(!k)return null;return d.ings.find(i=>normS(i.nom)===k)||d.ings.find(i=>{const a=normS(i.nom);return a.startsWith(k)||k.startsWith(a)})}
function findPz(d,n){const k=normS(n);return d.recs.find(r=>normS(r.nom)===k)}

      if(p.ttc>0){logPrix(d,ex.nom,ex.ttc,p.ttc);ex.ttc=p.ttc}if(p.since)ex.since=p.since;if(p.lines.length)ex.l=p.lines.map(l=>{const o={i:getI(l),g:+l.g};if(l.pes>0)o.pes=+l.pes;return o})})},()=>'Fiches techniques mises à jour ('+ps.length+' pizza'+(ps.length>1?'s':'')+'). Tous les coûts et ratios sont recalculés.')}
  if(t.dataset.drixok){const x=drafts.find(z=>z.id===t.dataset.drixok);drafts=drafts.filter(z=>z.id!==x.id);return change(()=>{d.index=x.doc.factures.map(f=>({...f}))},()=>{const c=controle(d);return `Index enregistré : ${c.rows.length} factures attendues, ${c.ok} reçues et conformes, ${c.missing} manquantes, ${c.diff} avec un total différent.`})}
  if(t.dataset.drcadok){const x=drafts.find(z=>z.id===t.dataset.drcadok);drafts=drafts.filter(z=>z.id!==x.id);return change(()=>{d.cad=Object.assign({},x.doc.cad)},(b,a)=>`Cadrage mis à jour. Cible de ratio : <b>${pc(a.c)}</b> (avant : ${pc(b.c)}).`)}
  if(t.dataset.drx){drafts=drafts.filter(z=>z.id!==t.dataset.drx);return render()}
  if(t.dataset.drlx){const x=drafts.find(z=>z.id===t.dataset.dr);x.doc.lines.splice(+t.dataset.drlx,1);return render()}
  if(t.dataset.dradd2){const x=drafts.find(z=>z.id===t.dataset.dradd2);x.doc.lines.push({label:'',q:0,ht:0,i:'',p:''});return render()}
  if(t.dataset.dradd){const x=drafts.find(z=>z.id===t.dataset.dradd),k=x.doc,isA=k.type==='achat';
    const okL=k.lines.filter(l=>isA?(l.i&&l.q>0&&!isNaN(l.ht)&&(l.i!=='__new'||(l.nw&&l.nw.nom&&l.nw.g>0))):(l.p&&l.q>0&&(l.p!=='__new'||l.pnom)));
    if(!okDate(k.date)){x.err='Renseigne une date valide pour le document.';return render()}
    if(!okL.length||okL.length<k.lines.length){x.err='Chaque ligne doit avoir un '+(isA?'ingrédient (ou « Nouvel ingrédient » avec un nom et un contenu), une quantité et un montant HT':'nom de pizza et une quantité')+'. Corrige ou retire les lignes incomplètes.';return render()}
    const dupDoc=isA?d.docs.some(o=>o.type==='achat'&&o.ref&&norm(o.ref)===norm(k.ref||'')):d.docs.some(o=>o.type==='vente'&&o.date.slice(0,7)===k.date.slice(0,7));
    const flagged=okL.some(l=>l.i!=='__new'&&lineFlag(d,k,l,isA)&&['bd'].includes(lineFlag(d,k,l,isA).lvl));
    if((dupDoc||flagged)&&!x.force){x.force=true;x.err=(dupDoc?'Doublon probable : un document identique existe déjà. ':'')+(flagged?'Des lignes sont signalées en rouge. ':'')+'Clique sur « Ajouter quand même » si tu es sûr.';return render()}
    drafts=drafts.filter(z=>z.id!==x.id);
    let created=0;
    return change(()=>{
      if(isA){const out=[];
        okL.forEach(l=>{let id=l.i;const nw=l.nw||{};
          if(id==='__new'){const ex=findIng(d,nw.nom);if(ex)id=ex.id;else{const n={id:uid(),nom:nw.nom,unite:nw.unite||'unité',g:+nw.g||1,prix:l.q?l.ht/l.q:0,rend:Math.min(1,(+nw.rendp||100)/100),tva:+nw.tva||5.5};if(/bo[iî]te/i.test(n.nom))n.pc=true;d.ings.push(n);id=n.id;created++}}
          out.push({i:id,q:+l.q,ht:+l.ht,nw})});
        out.forEach(l=>{const i=d.ings.find(z=>z.id===l.i);if(!i)return;
          if(i.prov){delete i.prov;if(l.nw.unite)i.unite=l.nw.unite;if(+l.nw.g>0)i.g=+l.nw.g;if(+l.nw.tva)i.tva=+l.nw.tva;if(+l.nw.rendp&&+l.nw.rendp<100)i.rend=+l.nw.rendp/100}
          const later=d.docs.some(o=>o.type==='achat'&&o.date>k.date&&o.l.some(z=>z.i===i.id));
          if(!later&&l.q>0)i.prix=Math.round(l.ht/l.q*100)/100});
        d.docs.push({id:uid(),type:'achat',date:k.date,ref:k.ref||'Facture',fourn:k.fourn||'Fournisseur',l:out.map(l=>({i:l.i,q:l.q,ht:l.ht}))})}
      else{const out=okL.map(l=>{let p=l.p;if(p==='__new'){const ex=findPz(d,l.pnom);if(ex)p=ex.nom;else{d.recs.push({nom:l.pnom,ttc:0,l:[]});p=l.pnom;created++}}return {p,q:+l.q}});
        d.docs.push({id:uid(),type:'vente',date:k.date,ref:k.ref||'Rapport de ventes',fourn:'Caisse',l:out})}
    },(b,a)=>docMsg(k.date)(b,a)+(created?' '+created+(isA?' ingrédient(s) ajouté(s) à la liste.':' pizza(s) créée(s) sans recette : dépose la carte et les recettes.'):''))}
  if(t.dataset.per){period=t.dataset.per;banner=null;return render()}
  if(t.dataset.rec){rec=t.dataset.rec;return render()}
  if(t.id==='fadd')return addRow('f');if(t.id==='vadd')return addRow('v');
  if(t.classList.contains('rm')){const tr=t.closest('tr');if(tr.parentNode.children.length>1)tr.remove();return}
  if(t.dataset.del){return change(()=>{d.docs=d.docs.filter(x=>x.id!==t.dataset.del)},()=> 'Document supprimé. Recalcul fait.')}
  if(t.id==='fsave'){const l=[...document.querySelectorAll('#fl tbody tr')].map(r=>({i:r.querySelector('.fi').value,q:parseNum(r.querySelector('.fq').value),ht:parseNum(r.querySelector('.fh').value)})).filter(x=>x.q>0||x.ht>0);
    const date=$('#fd').value;if(!date||!l.length||l.some(x=>!(x.q>0)||isNaN(x.ht))){$('#ferr').textContent='Complète la date, la quantité et le montant HT de chaque ligne.';return}
    return change(()=>d.docs.push({id:uid(),type:'achat',date,ref:$('#fr').value||'Facture',fourn:$('#ff').value||'Fournisseur',l}),docMsg(date))}
  if(t.id==='vsave'){const l=[...document.querySelectorAll('#vl tbody tr')].map(r=>({p:r.querySelector('.vp').value,q:parseNum(r.querySelector('.vq').value)})).filter(x=>x.q>0);
    const date=$('#vd').value;if(!date||!l.length){$('#verr').textContent='Complète la date et au moins une quantité.';return}
    return change(()=>d.docs.push({id:uid(),type:'vente',date,ref:$('#vr').value||'Rapport de ventes',fourn:'Caisse',l}),docMsg(date))}
  if(t.id==='cfb'||t.id==='cvb'){const isF=t.id==='cfb',txt=$(isF?'#cf':'#cv').value.trim(),date=$(isF?'#cfd':'#cvd').value;const bad=[],l=[];
    txt.split(/\n+/).filter(x=>x.trim()).forEach((ln,k)=>{const p=ln.split(/[;\t]/).length>1?ln.split(/[;\t]/):ln.split(',');
      if(isF){const i=findIng(d,p[0]),q=parseNum(p[1]),h=parseNum(p[2]);if(!i||!(q>0)||isNaN(h))bad.push(k+1);else l.push({i:i.id,q,ht:h})}
      else{const z=findPz(d,p[0]),q=parseNum(p[1]);if(!z||!(q>0))bad.push(k+1);else l.push({p:z.nom,q})}});
    if(bad.length||!l.length||!date){$('#cerr').textContent=!l.length&&!bad.length?'Rien à importer.':'Lignes non reconnues : '+bad.join(', ')+'. Vérifie le nom (comme dans Ingrédients ou Fiches) et les nombres.';return}
    return change(()=>d.docs.push(isF?{id:uid(),type:'achat',date,ref:'Import',fourn:$('#cff').value||'Import',l}:{id:uid(),type:'vente',date,ref:'Import ventes',fourn:'Caisse',l}),docMsg(date))}
  if(t.id==='radd')return change(()=>{const n='Nouvelle pizza '+(d.recs.length+1);d.recs.push({nom:n,ttc:10,l:[]});rec=n});

  if(t.id==='ladd')return change(()=>{if(d.ings[0])d.recs.find(r=>r.nom===rec).l.push({i:d.ings[0].id,g:0})});
  if(t.dataset.lx!=null)return change(()=>d.recs.find(r=>r.nom===rec).l.splice(+t.dataset.lx,1));
  if(t.id==='iadd')return change(()=>d.ings.push({id:uid(),nom:'Nouvel ingrédient',unite:'kg',g:1000,prix:1,rend:1,tva:5.5}));
  if(t.dataset.idel){const used=d.recs.some(r=>r.l.some(l=>l.i===t.dataset.idel))||d.docs.some(x=>x.l.some(l=>l.i===t.dataset.idel));if(used){$('#ierr').textContent='Cet ingrédient est utilisé dans une recette ou une facture. Retire-le d\'abord de ces endroits.';return}return change(()=>d.ings=d.ings.filter(i=>i.id!==t.dataset.idel))}
  if(t.id==='apply')return change(()=>{d.recs.forEach(r=>{if(d.sim[r.nom]!=null){logPrix(d,r.nom,r.ttc,+d.sim[r.nom]);r.ttc=+d.sim[r.nom]}});d.sim={}},()=>'Nouveaux prix appliqués à la carte. Tous les ratios sont recalculés.');
  if(t.id==='reset')return change(()=>d.sim={});

  if(t.id==='impb'){try{const o=JSON.parse($('#imp').value);if(!o.clients||!o.cur||!o.clients[o.cur])throw 0;S=o;save();banner='Sauvegarde restaurée.';render()}catch(x){$('#serr').textContent='Sauvegarde illisible. Colle le texte complet copié depuis ce logiciel.'}return}

document.addEventListener('change',e=>{
  const t=e.target,d=D();
  if(t.id==='docf'){const fs=[...t.files];t.value='';handleFiles(fs);return}
  if(t.dataset.dr){const x=drafts.find(z=>z.id===t.dataset.dr);if(!x||!x.doc)return;x.err=null;
    if(t.dataset.drnw){const l=x.doc.lines[+t.dataset.drl],f=t.dataset.drnw;l.nw[f]=(f==='nom'||f==='unite')?t.value:(parseNum(t.value)||0);return render()}
    if(t.dataset.drpn){x.doc.lines[+t.dataset.drl].pnom=t.value;return render()}
    if(t.dataset.drpz!=null){const p=x.doc.pizzas[+t.dataset.drpz],c=t.dataset.drpc;if(t.dataset.drpl!=null){const l=p.lines[+t.dataset.drpl];l[c]=(c==='i')?t.value:(parseNum(t.value)||0)}else p[c]=c==='nom'?t.value:(parseNum(t.value)||0);return render()}
    if(t.dataset.drcad){x.doc.cad[t.dataset.drcad]=parseNum(t.value)||0;return}
    if(t.dataset.drf)x.doc[t.dataset.drf]=t.value;
    else{const l=x.doc.lines[+t.dataset.drl],c=t.dataset.drc;l[c]=(c==='q'||c==='ht')?parseNum(t.value):t.value}
    return render()}
  if(t.id==='cl'){drafts=[];S.cur=t.value;period='all';rec=null;banner=null;save();return render()}
  if(t.dataset.f){const i=d.ings.find(x=>x.id===t.dataset.i);let v=t.value;if(t.dataset.f==='nom'||t.dataset.f==='unite'){if(!v.trim())return render()}else{v=parseNum(v);if(!(v>0))return render();if(t.dataset.f==='rend')v=Math.min(v,100)/100}
    return change(()=>i[t.dataset.f]=v,(b,a)=>{const x=b.m[b.m.length-1],y=a.m[a.m.length-1];return x&&y&&x[1]!=null&&y[1]!=null?`Ingrédient modifié. Ratio réel de ${mlab(y[0])} : ${pc(x[1])} → <b>${pc(y[1])}</b>.`:'Ingrédient modifié.'})}
  if(t.id==='rn'){const v=t.value.trim();if(!v||d.recs.some(r=>r.nom===v))return render();return change(()=>{const r=d.recs.find(r=>r.nom===rec);d.docs.forEach(x=>x.l.forEach(l=>{if(l.p===r.nom)l.p=v}));r.nom=v;rec=v})}
  if(t.id==='rp')return change(()=>{const r=d.recs.find(r=>r.nom===rec);const v=parseNum(t.value)||0;logPrix(d,r.nom,r.ttc,v);r.ttc=v});

  if(t.dataset.ls!=null)return change(()=>d.recs.find(r=>r.nom===rec).l[+t.dataset.ls].i=t.value);
  if(t.dataset.lp!=null)return change(()=>{const l=d.recs.find(r=>r.nom===rec).l[+t.dataset.lp];const v=parseNum(t.value);if(v>0)l.pes=v;else delete l.pes});
  if(t.dataset.lg!=null)return change(()=>d.recs.find(r=>r.nom===rec).l[+t.dataset.lg].g=parseNum(t.value)||0);
  if(t.dataset.sim){d.sim[t.dataset.sim]=parseNum(t.value);save();return render()}
  if(t.dataset.cad)return change(()=>d.cad[t.dataset.cad]=parseNum(t.value)||0);
  if(t.id==='pro_nom'||t.id==='pro_ct'){S.pro=S.pro||{};S.pro[t.id==='pro_nom'?'nom':'ct']=t.value.trim();save();return}

});
